<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light dark}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>전두엽 데일리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app — a "control tower" status board on top, mission cards below, fixed bottom tab bar. */
:root{
  --bg:#EDF0ED; --surface:#FFFFFF; --surface-2:#F5F7F5; --ink:#16201B; --muted:#56655D; --line:#D3DBD6;
  --accent:#0B7A5E; --accent-ink:#FFFFFF; --accent-soft:#D5EDE4; --mini:#8CC3B0;
  --amber:#9A5B00; --amber-soft:#FBEACB; --danger:#B3261E;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1210; --surface:#151C19; --surface-2:#1B2420; --ink:#E5EDE8; --muted:#97A79E; --line:#26322C;
  --accent:#3BCB9C; --accent-ink:#04261B; --accent-soft:#16382D; --mini:#2C6A56;
  --amber:#F2B550; --amber-soft:#3A2B10; --danger:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1210; --surface:#151C19; --surface-2:#1B2420; --ink:#E5EDE8; --muted:#97A79E; --line:#26322C;
  --accent:#3BCB9C; --accent-ink:#04261B; --accent-soft:#16382D; --mini:#2C6A56;
  --amber:#F2B550; --amber-soft:#3A2B10; --danger:#FF8A80; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:22px;font-weight:700;letter-spacing:-0.01em}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.modes button{border:0;background:transparent;border-radius:9px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3}
.modes button b{font-size:14px}
.modes button span{font-size:11px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.modes button[aria-pressed="true"][data-mode="normal"] b{color:var(--accent)}
.modes button[aria-pressed="true"][data-mode="busy"] b,.modes button[aria-pressed="true"][data-mode="appt"] b{color:var(--amber)}
.m.skip{opacity:.72}
.mode-rows{display:flex;flex-direction:column;gap:6px}
.modes.two{grid-template-columns:repeat(2,1fr)}
.board.compact .ring{width:84px;height:84px}.board.compact .ring svg{width:84px;height:84px}
.pinned{display:grid;grid-template-columns:1fr;gap:10px}
.pin{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.pin.done{border-color:var(--accent)}
.pin .quote p{font-size:17px}
.newday{font-size:16px;font-weight:600;line-height:1.45}
.pin-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mini-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.mini-btn.on1{background:var(--mini);border-color:var(--mini)}
.mini-btn.on2{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.link-btn{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:4px 6px;text-decoration:underline}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip.now{border-color:var(--amber)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on span{color:inherit;opacity:.8}
.chip.done span{color:var(--accent)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.block.is-now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.block-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.task-list{display:flex;flex-direction:column;gap:8px}
.chk.task{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:15px}
.chk.task[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent}
.chk.task[aria-pressed="true"] span:nth-child(2){text-decoration:line-through;opacity:.7}
.block .m{border-color:var(--line)}
.core-tag{background:var(--accent-soft);color:var(--accent)}
.block-done{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.ed-list{display:flex;flex-direction:column;gap:6px}
.ed-row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sel{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px;flex:1;min-width:0}
.steps-track{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.steps-track i{display:block;height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.steps-track i.s2{background:var(--accent);border-color:transparent}
.steps-track i.s1{background:var(--mini);border-color:transparent}
.steps-track i.sk{background:var(--line);border-color:transparent}
.steps-track i.cur{background:var(--amber);border-color:transparent}
.detail{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.detail-d{background:var(--surface-2);border-radius:10px;padding:8px 12px}
.detail-d summary{font-size:13px;font-weight:600;color:var(--accent);cursor:pointer}
.detail-d[open]{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.how{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.tip{font-size:13px;color:var(--amber);font-weight:500}
.passed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.passed summary{font-weight:600;cursor:pointer}
.passed-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:14px}
.btn.small{padding:4px 10px;font-size:12px}
.update-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px}
.skip-note{font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:6px 10px}

/* status board */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .label b{font-family:var(--mono);font-size:24px;line-height:1}
.ring .label span{font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted)}
.board .msg{grid-column:1/-1;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.progress66{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* mission cards */
.list{display:flex;flex-direction:column;gap:10px}
.m{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.m.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.m.done-2{background:var(--accent-soft);border-color:transparent}
.m-head{display:flex;gap:12px;align-items:flex-start}
.m-time{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;padding-top:2px}
.m-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.m-cue{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:2px}
.now-tag{background:var(--accent);color:var(--accent-ink)}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lv button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;min-height:52px}
.lv button b{font-size:13px}
.lv button span{font-size:12px;color:var(--muted);line-height:1.4}
.lv button[aria-pressed="true"].l1{background:var(--mini);border-color:var(--mini);color:var(--ink)}
.lv button[aria-pressed="true"].l2{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lv button[aria-pressed="true"] span{color:inherit;opacity:.85}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
input[type=number],input[type=time],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:44px}
input[type=number]{width:96px}
input[type=time]{width:120px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600}
.quote{margin:0;padding:14px 16px;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:4px 10px 10px 4px;display:flex;flex-direction:column;gap:8px}
.quote p{font-family:'Gowun Batang',Georgia,serif;font-size:18px;line-height:1.7;word-break:keep-all}
.quote cite{font-style:normal;font-size:12px;color:var(--muted)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}

/* weekly strip */
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0;border:0;background:none;text-align:left;width:100%}
.box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.chk[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.chk[aria-pressed="true"] .box::after{content:"";width:10px;height:6px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}

/* history */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .c{aspect-ratio:1;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);max-width:100%}
.heat .c.s1{background:var(--mini);border-color:transparent}
.heat .c.s2{background:var(--accent);border-color:transparent}
.heat .c.rest{background:var(--amber-soft);border-color:var(--amber)}
.heat .c.today{outline:2px solid var(--ink);outline-offset:1px}
.heat .c.future{opacity:.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.jr{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.jr:first-of-type{border-top:0;padding-top:0}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pill{background:var(--surface-2);border-radius:10px;padding:10px}
.pill .v{font-family:var(--mono);font-size:18px;font-weight:600}

/* evidence */
.ev{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.ev:first-of-type{border-top:0;padding-top:0}
.grade{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.g-a{background:var(--accent);color:var(--accent-ink)}
.g-b{background:var(--accent-soft);color:var(--accent)}
.g-c{background:var(--amber-soft);color:var(--amber)}

/* routine settings */
.rt{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.rt:first-of-type{border-top:0;padding-top:0}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 12px;font-size:12px;color:var(--muted);text-decoration:none;font-weight:500}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:700}

/* breathing overlay */
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center}
[hidden]{display:none!important}
.orb{width:220px;height:220px;max-width:70vw;max-height:70vw;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--accent-soft),var(--accent));transform:scale(.55);transition:transform 4s ease-in-out}
.orb.big{transform:scale(1)}
.ov .phase{font-size:24px;font-weight:700}
.ov .left{font-family:var(--mono);font-size:15px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.orb{transition:none}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.sync{font-size:12px;color:var(--muted)}
</style>

<div class="wrap" id="app" aria-live="polite">
  <div class="top"><div><p class="eyebrow">불러오는 중</p><h1>전두엽 데일리</h1></div></div>
  <div class="board"><p class="msg">오늘의 미션과 기록을 불러오고 있어요.</p></div>
</div>

</div></nav>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-label="호흡 타이머">
  <p class="eyebrow">박스 호흡 4·4·4·4</p>
  <div class="orb" id="orb"></div>
  <p class="phase" id="phase">준비</p>
  <p class="left" id="left"></p>
  <div class="row"><button class="btn" id="ovStop">그만하기</button></div>
</div>

<script>
(function(){
"use strict";

/* ---------- 미션 정의 ---------- */
const MISSIONS = [
  {id:"sleep", title:"어젯밤 수면 기록", pillar:"수면", kind:"sleep", time:"07:00",
   cue:"일어나서 물 한 잔 마시면", full:"7시간 이상 잤다", mini:"수면 시간만 기록",
   why:"잠이 부족한 날은 감정을 누르는 전두엽의 힘이 약해져요. 매일 숫자로 보면 늦게 자는 습관이 눈에 들어와요.",
   how:["일어나자마자 물 한 컵을 마셔요.","삼성헬스 수면 기록이 자동으로 들어왔는지 확인해요.","7시간이 안 됐다면 오늘 밤 취침 시각을 30분 당기기로 정해요."],
   tip:"수면이 6시간 미만인 날은 ‘바쁜 날 모드’로 바꾸고 목표를 낮추세요."},
  {id:"plan", title:"손으로 오늘 계획 쓰기", pillar:"손·계획", kind:"check", time:"07:20",
   cue:"아침 먹으면서", full:"할 일 3개와 1순위를 종이에", mini:"할 일 1개만 종이에",
   why:"계획을 세우고 우선순위를 고르는 일이 바로 전두엽의 핵심 기능이에요. 손으로 쓰면 더 천천히, 더 분명하게 생각하게 돼요.",
   how:["책상 위에 둔 노트와 펜을 펴요.","오늘 꼭 끝내야 할 일 3개를 적어요(학교·부업·나 자신 각 1개).","가장 중요한 1개에 동그라미를 쳐요.","그 일을 언제 할지 시간을 옆에 적어요."],
   tip:"노트와 펜은 전날 밤 책상 위에 펼쳐 두세요. 찾는 데 드는 10초가 미루는 이유가 돼요."},

function nowMissionId(d){
  const v=day(d), n=nowMin(); let best=null, bestGap=1e9;
  MISSIONS.forEach(m=>{ const t=toMin(routineOf(m.id).time); if(t==null) return; const done=v.done[m.id]&&v.done[m.id].lvl; if(done) return; const gap=n-t; if(gap>=-30 && gap<180 && Math.abs(gap)<bestGap){ best=m.id; bestGap=Math.abs(gap);} });
  return best;
}
function coachLine(d){
  const s=score(d), g=goal(d), v=day(d), st=streak();
  if(s>=g) return "오늘 목표 달성. 남은 미션은 보너스예요.";
  const mc=MODES[modeOf(v)].coach; if(mc) return mc;
  const y=addDays(d,-1);
  if(y>=S.settings.startDate && !success(y)) return "어제는 쉼표였어요. 오늘 이어 가면 연속 기록이 유지됩니다.";
  if(st.n===0) return "작은 버전부터 하나씩. 체크할 때마다 1~2점이 쌓여요.";
  return "목표까지 "+(g-s)+"점. 작은 버전도 1점이에요.";
}

function blockStat(v,b){
  const md=MODES[modeOf(v)]; let total=0,left=0;
  b.tasks.forEach(t=>{ const ti=taskInfo(t); if(!ti) return; if(ti.core&&md.skip.includes(ti.id)) return; total++; const x=v.done[ti.id]; if(!(x&&(x.lvl>0||x.skipped))) left++; });
  return {total,left};
}
function pinnedCards(v){

  const ql=v.done.novel&&v.done.novel.lvl||0;
  const nd=v.newday||{idx:hashIdx(v.date+"n")%NOVELTY.length}, nl=v.done.newday&&v.done.newday.lvl||0;
  return `<section class="pinned">
    <article class="pin ${ql?"done":""}">
      <p class="eyebrow">오늘의 필사</p>
      <blockquote class="quote"><p>${esc(q[0])}</p><cite>${esc(q[1])}</cite></blockquote>

        ${nd.rerolled?"":`<button class="link-btn" id="rerollNew">다른 루틴</button>`}

    </article>

}
function blockView(v,b,vi,nowIdx,blocks){
  const md=MODES[modeOf(v)], stt=blockStat(v,b);
  let h=`<section class="block ${vi===nowIdx?"is-now":""}">
    <div class="block-h"><div><h3>${esc(b.title)}</h3><p class="small muted num">${esc(b.start)} – ${esc(b.end)} ${vi===nowIdx?"· 지금":vi<nowIdx?"· 지난 시간대":"· 다가올 시간대"}</p></div><span class="small muted">${stt.total-stt.left}/${stt.total} 완료</span></div>
    <div class="task-list">`;
  b.tasks.forEach(t=>{
    const ti=taskInfo(t); if(!ti) return;
    if(ti.core){
      if(md.skip.includes(ti.id)){ h+=`<p class="skip-note">${esc(ti.title)}: ${esc(md.label)} 모드라 오늘은 쉬어요</p>`; return; }
      h+=missionCard(ti.core,v,vi===nowIdx,false,true);
    } else {
      const on=!!(v.done[ti.id]&&v.done[ti.id].lvl);
      h+=`<button class="chk task" data-task="${esc(ti.id)}" aria-pressed="${on}"><span class="box"></span><span>${esc(ti.title)}</span><span class="small muted">1점</span></button>`;
    }
  });
  h+=`</div>`;
  if(stt.total && stt.left===0){ const nx=blocks[vi+1]; h+=`<p class="block-done">이 시간대 할 일 끝! ${nx?`다음은 <b>${esc(nx.title)}</b> (${esc(nx.start)}부터)`:"오늘 하루 수고했어요."}</p>`; }
  const missed=blocks.slice(0,nowIdx).map((bb,i)=>({i,left:blockStat(v,bb).left,t:bb.title})).filter(x=>x.left>0);
  if(vi===nowIdx && missed.length) h+=`<p class="small muted">앞 시간대에 남은 일: ${missed.map(x=>`<button class="link-btn" data-view="${x.i}">${esc(x.t)} ${x.left}개</button>`).join(" ")}</p>`;

}

function isPassed(v,id){ const x=v.done[id]; return !!(x&&(x.lvl>0||x.skipped)) || MODES[modeOf(v)].skip.includes(id); }

function renderHistory(){
  const t=today(), start=S.settings.startDate;
  const firstMon = weekDates(addDays(t,-69))[0];
  const cells=[]; for(let d=firstMon; cells.length<77; d=addDays(d,1)) cells.push(d);
  const st=streak();
  let h=`<div class="top"><div><p class="eyebrow">최근 11주</p><h1>기록</h1></div></div>
  <section class="card"><div class="heat" role="img" aria-label="최근 11주 성공 기록">
  ${DOW.slice(1).concat(DOW[0]).map(x=>`<div class="small muted" style="text-align:center">${x}</div>`).join("")}
  ${cells.map(d=>{ let cls="c"; if(d>t) cls+=" future"; else if(d>=start){ const s=score(d), g=goal(d); if(s>=g) cls+=" s2"; else if(s>0) cls+=" s1"; else if(d<t && success(addDays(d,-1)) && success(addDays(d,1))) cls+=" rest"; } if(d===t) cls+=" today"; return `<div class="${cls}" title="${d} · ${score(d)}점"></div>`; }).join("")}
  </div>
  <div class="legend"><span><i style="background:var(--accent)"></i>목표 달성</span><span><i style="background:var(--mini)"></i>일부 체크</span><span><i style="background:var(--amber-soft);border-color:var(--amber)"></i>쉼표(하루 쉼)</span></div>
  <p class="small muted">연속 ${st.n}일 · 시작일 ${esc(start)}</p></section>`;
  // 영역별 30일 체크율
  const last30=Array.from({length:30},(_,i)=>addDays(t,-i)).filter(d=>d>=start);
  h+=`<div class="section-h"><h2>영역별 실천율</h2><span class="small muted">최근 ${last30.length}일</span></div><section class="pillars">`;
  MISSIONS.forEach(m=>{ const n=last30.filter(d=>S.days[d]&&S.days[d].done[m.id]&&S.days[d].done[m.id].lvl).length; const p=last30.length?Math.round(n/last30.length*100):0; h+=`<div class="pill"><div class="small muted">${esc(m.pillar)}</div><div class="v">${p}%</div><div class="bar" aria-hidden="true"><i style="width:${p}%"></i></div></div>`; });
  h+=`</section>`;
  // 수면
  const sl=last30.map(d=>S.days[d]&&S.days[d].sleepH).filter(x=>typeof x==="number");
  if(sl.length) h+=`<p class="small muted">평균 수면 <span class="num">${(sl.reduce((a,b)=>a+b,0)/sl.length).toFixed(1)}</span>시간 (${sl.length}일 기록)</p>`;
  const stp=last30.map(d=>S.days[d]&&S.days[d].steps).filter(x=>typeof x==="number");
  if(stp.length) h+=`<p class="small muted">평균 걸음 <span class="num">${Math.round(stp.reduce((a,b)=>a+b,0)/stp.length).toLocaleString()}</span>보 (${stp.length}일 기록)</p>`;
  // 주간 회고
  const w=isoWeek(t), wk=S.weeks[w]||{}, rv=wk.reviewText||{};
  const wd=weekDates(t).filter(d=>d<=t&&d>=start); const wsucc=wd.filter(success).length;
  h+=`<div class="section-h"><h2>주간 회고</h2><span class="small muted">${esc(w)} · 성공 ${wsucc}/${wd.length}일</span></div>
  <section class="card">
    <div class="field"><label for="rv1">이번 주 가장 잘 지킨 미션과 그 이유</label><textarea id="rv1" data-rv="a" rows="2">${esc(rv.a)}</textarea></div>
    <div class="field"><label for="rv2">무너진 순간은 언제였고, 무엇이 방해했나요?</label><textarea id="rv2" data-rv="b" rows="2">${esc(rv.b)}</textarea></div>
    <div class="field"><label for="rv3">다음 주에 환경을 하나 바꾼다면?</label><textarea id="rv3" data-rv="c" rows="2">${esc(rv.c)}</textarea></div>
    <p class="small muted">세 칸을 모두 채우면 이번 주 체크리스트의 ‘주간 회고’가 자동으로 체크돼요.</p>
  </section>`;
  // 최근 기록
  const recent=Object.keys(S.days).filter(d=>d<=t).sort().reverse().filter(d=>{ const j=S.days[d].journal||{}; return j.good||j.bad||j.next; }).slice(0,10);

  h+= recent.length? recent.map(d=>{ const j=S.days[d].journal; const dd=parse(d); return `<div class="jr"><p class="eyebrow">${dd.getMonth()+1}/${dd.getDate()} ${DOW[dd.getDay()]}</p>${j.good?`<p><b>잘한 것</b> ${esc(j.good)}</p>`:""}${j.bad?`<p><b>바꿀 것</b> ${esc(j.bad)}</p>`:""}${j.next?`<p><b>내일 첫 할 일</b> ${esc(j.next)}</p>`:""}</div>`; }).join("") : `<p class="muted">아직 기록이 없어요. 오늘 탭의 ‘저녁 3줄 기록’에 한 줄을 쓰면 여기에 쌓입니다.</p>`;
  h+=`</section>`;
  return h;
}

function gcalLink(m){
  const r=routineOf(m.id); if(!r.time) return null;
  const start=addDays(today(),1).replace(/-/g,"");
  const [hh,mm]=r.time.split(":").map(Number); const endM=hh*60+mm+10;
  const s=start+"T"+pad(hh)+pad(mm)+"00", e=start+"T"+pad(Math.floor(endM/60)%24)+pad(endM%60)+"00";
  const text="[전두엽] "+m.title; const details=r.cue+" → "+m.title+"\n작게: "+m.mini+"\n제대로: "+m.full+"\n하고 나서 전두엽 데일리에서 체크하세요.";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(text)+"&details="+encodeURIComponent(details)+"&dates="+s+"/"+e+"&ctz=Asia%2FSeoul&recur="+encodeURIComponent("RRULE:FREQ=DAILY");
}

/* ---------- 근거 화면 ---------- */
function renderWhy(){
  return `<div class="top"><div><p class="eyebrow">근거와 설계 원리</p><h1>왜 이 미션인가</h1></div></div>
  <section class="card">
    <p>유튜브 내용을 연구와 대조해 근거가 강한 것부터 미션으로 넣었어요. 등급은 <span class="grade g-a">강</span> 여러 연구에서 일관됨, <span class="grade g-b">중</span> 효과는 있으나 작음, <span class="grade g-c">약</span> 소규모·재현 불확실입니다.</p>
  </section>
  <section class="card">
    <div class="ev"><h3>수면<span class="grade g-a">강</span></h3><p class="small">하룻밤만 못 자도 감정 반응을 담당하는 편도체가 크게 과민해지고, 이를 누르는 전전두엽과의 연결이 약해진다는 연구가 반복해서 나왔어요(Yoo 등, 2007). 그래서 수면을 아침 첫 미션으로 기록합니다.</p><a class="small" href="https://www.sfn.org/publications/latest-news/2015/09/23/lack-of-sleep-may-impair-ability-to-regulate-emotions" target="_blank" rel="noopener">수면 부족과 감정 조절 ↗</a></div>
    <div class="ev"><h3>만약-그러면 계획<span class="grade g-a">강</span></h3><p class="small">‘언제, 어디서, 무엇을’ 미리 정해 두면 목표 달성률이 뚜렷이 오른다는 메타분석이 있어요(94개 연구, Gollwitzer·Sheeran 2006). 루틴 탭의 ‘신호 → 미션’이 이 원리입니다.</p><a class="small" href="https://cancercontrol.cancer.gov/brp/research/constructs/implementation-intentions" target="_blank" rel="noopener">실행 의도 개요 (미국 국립암연구소) ↗</a></div>
    <div class="ev"><h3>유산소 운동<span class="grade g-b">중</span></h3><p class="small">꾸준한 유산소 운동과 한 번의 중강도 운동 모두 실행기능에 도움이 된다는 결과가 있지만 효과 크기는 작은 편이에요. 이미 하는 운동을 인정하고, 바쁜 날엔 10분 걷기로 대신합니다. 부업 직전 걷기는 짧은 운동 직후 집중이 좋아진다는 연구를 적용한 것이에요.</p><a class="small" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11856442/" target="_blank" rel="noopener">중강도 유산소와 실행기능 체계적 고찰 ↗</a></div>
    <div class="ev"><h3>호흡·명상<span class="grade g-b">중</span></h3><p class="small">명상이 실행기능 자체를 키운다는 근거는 작고 연구마다 엇갈려요. 대신 순간적으로 감정을 가라앉히는 도구로 쓰기 좋아서, 오후 수업 전 1~3분으로 짧게 넣었어요.</p><a class="small" href="https://scalda.mijn.bsl.nl/does-mindfulness-meditation-training-enhance-executive-control-a/17493418" target="_blank" rel="noopener">명상과 실행 통제 메타분석 ↗</a></div>
    <div class="ev"><h3>손글씨<span class="grade g-c">약</span></h3><p class="small">2024년 노르웨이 연구에서 손글씨를 쓸 때 타이핑보다 뇌 연결이 넓게 활성화됐어요. 다만 대학생 36명 규모라 결론은 조심스러워요. ‘운동피질의 30%가 손’이라는 수치도 정확한 근거를 찾기 어려워요. 그래도 계획을 종이에 쓰는 건 계획 기능 연습 자체라 아침 미션으로 넣었어요.</p><a class="small" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10853352/" target="_blank" rel="noopener">손글씨와 뇌 연결성 연구 (2024) ↗</a></div>
    <div class="ev"><h3>스마트폰<span class="grade g-c">약</span></h3><p class="small">‘폰이 곁에 있기만 해도 인지 능력이 떨어진다’는 유명한 연구(Ward, 2017)는 이후 재현 연구에서 확인되지 않았어요. 그래서 이 앱은 폰을 수면과 집중 시간을 빼앗는 존재로 보고, 저녁 9시 폰 상자와 부업 시간의 폰 분리를 미션으로 둡니다.</p><a class="small" href="https://pubmed.ncbi.nlm.nih.gov/36007374/" target="_blank" rel="noopener">‘브레인 드레인’ 재현 연구 ↗</a></div>
    <div class="ev"><h3>새로운 도전·기록·관계<span class="grade g-c">약</span></h3><p class="small">새로움, 일기, 감사·용서가 전두엽을 직접 강화한다는 근거는 아직 약해요. 다만 사회적 지지와 기록이 스트레스 관리에 좋다는 근거는 많아요. 매일 바뀌는 필사 글귀는 손을 쓰면서 한 문장을 곱씹는 시간이고, 같은 루틴이 지루해지는 걸 막는 장치이기도 해요. 글귀는 논어·노자 같은 동양 고전과 세네카·마르쿠스 아우렐리우스 같은 스토아 철학에서 골라 직접 우리말로 옮겼어요.</p></div>
  </section>
  <section class="card"><h2>오래 가게 만드는 장치</h2>
  <ul class="small" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
    <li><b>작은 버전도 점수</b> · 의지가 없는 날에도 1분이면 체크할 수 있게.</li>
    <li><b>두 번 연속만 빠지지 말기</b> · 습관 연구에서 하루를 빠뜨려도 습관 형성에 큰 영향이 없었어요(Lally, 2010). 하루는 ‘쉼표’로 연속 기록이 이어집니다.</li>
    <li><b>평일·주말 루틴</b> · 요일에 맞춰 시간대와 할 일이 자동으로 바뀌어요. 지금 시간대의 할 일만 보여서 한 번에 한 묶음에만 집중할 수 있어요.</li>
    <li><b>컨디션 3가지</b> · 보통은 만점의 70%, 바쁜 날 45%, 약속 있는 날 55%(부업 블록 쉼)가 목표예요. 날에 맞춰 기준을 바꾸면 ‘오늘은 망했다’로 포기하는 날이 줄어요.</li>
    <li><b>매일 바뀌는 필사 글귀</b> · 고정 루틴에 하루 하나씩 새 문장이 들어옵니다.</li>
    <li><b>66일 진행 바</b> · 습관이 자리 잡는 데 평균 66일(사람에 따라 18~254일)이 걸렸다는 연구 기준이에요.</li>
    <li><b>주간 회고</b> · 의지가 아니라 환경을 하나씩 고치는 질문으로 마무리합니다.</li>
  </ul></section>`;
}

/* ---------- 렌더 & 이벤트 ---------- */
function render(){
  const app=document.getElementById("app");
  const t=S.tab;
  app.innerHTML = t==="history"?renderHistory(): t==="routine"?renderRoutine(): t==="why"?renderWhy(): renderToday();
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.tab===t) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  autoGrow();
  const c=document.querySelector(".chip.on"); if(c&&c.parentElement){ const pe=c.parentElement; pe.scrollLeft=Math.max(0,c.offsetLeft-pe.clientWidth/2+c.clientWidth/2); }
}
function autoGrow(){ document.querySelectorAll("textarea").forEach(el=>{ el.style.height="auto"; el.style.height=Math.max(44,el.scrollHeight+2)+"px"; }); }
function setLevel(id,l){ const d=today(), v=day(d); const before=success(d); const cur=v.done[id]&&v.done[id].lvl||0; if(cur===l) delete v.done[id]; else v.done[id]={lvl:l, at:Date.now()}; saveDay(d); render(); if(!before && success(d)) toast("오늘 목표 달성!"); }
function journalLevel(v){ const j=v.journal||{}; const n=["good","bad","next"].filter(k=>(j[k]||"").trim()).length; return n===0?0:n===3?2:1; }

document.addEventListener("click",e=>{
  const b=e.target.closest("button,a"); if(!b) return;
  if(b.dataset.m){ setLevel(b.dataset.m, Number(b.dataset.l)); return; }
  if(b.dataset.mode){ const v=day(today()); v.mode=b.dataset.mode; delete v.busy; saveDay(today()); render(); toast(MODES[v.mode].label+" · 오늘 목표 "+goal(today())+"점"); return; }
  if(b.dataset.daytype){ const v=day(today()); v.dayType=b.dataset.daytype; S.viewBlock=null; saveDay(today()); render(); toast(DAYTYPES[v.dayType].label+" 루틴으로 바꿨어요"); return; }
  if(b.dataset.view!=null){ S.viewBlock = b.dataset.view==="now"?null:Number(b.dataset.view); render(); return; }
  if(b.dataset.task){ const d=today(), v=day(d), id=b.dataset.task; const before=success(d); if(v.done[id]&&v.done[id].lvl) delete v.done[id]; else v.done[id]={lvl:1, at:Date.now()}; saveDay(d); render(); if(!before&&success(d)) toast("오늘 목표 달성!"); return; }
  if(b.id==="rerollNew"){ const v=day(today()); const cur=v.newday?v.newday.idx:hashIdx(today()+"n"); v.newday={idx:(cur+11)%NOVELTY.length, rerolled:true}; saveDay(today()); render(); return; }
  if(b.dataset.edittype){ S.editType=b.dataset.edittype; render(); return; }
  if(b.dataset.delTask){ const [i,j]=b.dataset.delTask.split(":").map(Number); ensureDraft(); S.draft[S.editType][i].tasks.splice(j,1); render(); return; }
  if(b.dataset.upTask){ const [i,j]=b.dataset.upTask.split(":").map(Number); ensureDraft(); const arr=S.draft[S.editType][i].tasks; if(j>0){ const x=arr[j]; arr[j]=arr[j-1]; arr[j-1]=x; } render(); return; }
  if(b.dataset.addTask!=null){ const i=Number(b.dataset.addTask); const inp=document.getElementById("add-"+i); const t=(inp&&inp.value||"").trim(); if(!t){ toast("할 일 이름을 적어 주세요"); return; } ensureDraft(); S.draft[S.editType][i].tasks.push({id:"t_"+Date.now().toString(36), title:t}); render(); return; }
  if(b.dataset.addCore!=null){ const i=Number(b.dataset.addCore); const sel=document.getElementById("core-"+i); if(!sel||!sel.value) return; ensureDraft(); S.draft[S.editType][i].tasks.push("c:"+sel.value); render(); return; }
  if(b.id==="saveBlocks"){ ensureDraft(); S.settings.blocks=clone(S.draft); saveSettings(); S.draft=null; render(); return; }
  if(b.id==="resetBlocks"){ ensureDraft(); S.draft[S.editType]=clone(DEFAULT_BLOCKS[S.editType]); render(); toast("기본 루틴으로 되돌렸어요. 저장을 눌러야 적용돼요."); return; }
  if(b.id==="reroll"){ const v=day(today()); v.novelty={idx:((v.novelty?v.novelty.idx:hashIdx(today()))+17)%QUOTES.length, rerolled:true}; saveDay(today()); render(); return; }
  if(b.dataset.health && NATIVE){ const a=b.dataset.health; try{ if(a==="perm") NATIVE.requestHealthPermission(); else if(a==="read") readHealth(); else if(a==="diag"){ S.diag=null; toast("점검 중…"); NATIVE.diagnoseHealth(); } else if(a==="open") NATIVE.openHealthConnect(); else if(a==="shealth"){ if(!NATIVE.openSamsungHealth()) toast("삼성헬스 앱을 찾지 못했어요"); } else if(a==="test"){ NATIVE.testNotification(); toast("알림을 보냈어요. 안 보이면 알림 권한을 확인해 주세요."); } }catch(e){ toast("앱 기능을 부르지 못했어요"); } return; }
  if(b.dataset.pass){ const d=today(), v=day(d), m=MISSIONS.find(x=>x.id===b.dataset.pass); v.done[b.dataset.pass]={lvl:0, skipped:true, at:Date.now()}; saveDay(d); render(); toast((m?m.title:"미션")+" 넘김 · 다음 미션이 열렸어요"); return; }
  if(b.dataset.reopen){ const d=today(), v=day(d); delete v.done[b.dataset.reopen]; saveDay(d); render(); window.scrollTo(0,0); return; }
  if(b.id==="focusToggle"){ S.focus=!S.focus; try{ localStorage.setItem(LS+"focus", S.focus?"1":"0"); }catch(e){} render(); return; }
  if(b.id==="doUpdate"){ if(NATIVE&&NATIVE.startUpdate){ S.update={...(S.update||{}), status:"downloading"}; render(); NATIVE.startUpdate(); } return; }
  if(b.dataset.breath){ startBreath(Number(b.dataset.breath)); return; }
  if(b.dataset.week){ const w=isoWeek(today()); S.weeks[w]=S.weeks[w]||{}; S.weeks[w][b.dataset.week]=!S.weeks[w][b.dataset.week]; saveWeek(w); render(); return; }
  if(b.id==="saveRt"){ document.querySelectorAll("[data-rt-time]").forEach(i=>{ S.settings.routine[i.dataset.rtTime]=S.settings.routine[i.dataset.rtTime]||{}; S.settings.routine[i.dataset.rtTime].time=i.value; }); document.querySelectorAll("[data-rt-cue]").forEach(i=>{ S.settings.routine[i.dataset.rtCue].cue=i.value.trim(); }); saveSettings(); render(); return; }
  if(b.id==="resetRt"){ S.settings.routine=DEFAULT_SETTINGS().routine; saveSettings(); render(); return; }
  if(b.id==="saveStart"){ const v=document.getElementById("startDate").value.trim(); if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||isNaN(parse(v))){ toast("2026-11-18 형식으로 입력해 주세요"); return; } S.settings.startDate=v; saveSettings(); render(); return; }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.j){ const d=today(), v=day(d); v.journal=v.journal||{}; v.journal[el.dataset.j]=el.value; const l=journalLevel(v); if(l) v.done.journal={lvl:l,at:Date.now()}; else delete v.done.journal; saveDay(d,700); refreshBoard(); el.style.height="auto"; el.style.height=Math.max(44,el.scrollHeight+2)+"px"; return; }
  if(el.id==="stepsN"){ const d=today(), v=day(d); const n=parseInt(el.value,10); if(isNaN(n)){ v.steps=null; delete v.done.steps; } else { v.steps=n; const l=n>=STEP.full?2:n>=STEP.mini?1:0; if(l) v.done.steps={lvl:l,at:Date.now()}; else delete v.done.steps; } saveDay(d,600); refreshBoard(); return; }
  if(el.id==="sleepH"){ const d=today(), v=day(d); const n=parseFloat(el.value); if(isNaN(n)){ v.sleepH=null; delete v.done.sleep; } else { v.sleepH=n; v.done.sleep={lvl:n>=7?2:1, at:Date.now()}; } saveDay(d,600); refreshBoard(); return; }
  if(el.dataset.bk){ const [i,f]=el.dataset.bk.split(":"); ensureDraft(); S.draft[S.editType][Number(i)][f]=el.value; return; }
  if(el.dataset.rv){ const w=isoWeek(today()); S.weeks[w]=S.weeks[w]||{}; S.weeks[w].reviewText=S.weeks[w].reviewText||{}; S.weeks[w].reviewText[el.dataset.rv]=el.value; const r=S.weeks[w].reviewText; S.weeks[w].review=!!((r.a||"").trim()&&(r.b||"").trim()&&(r.c||"").trim()); clearTimeout(timers.rv); timers.rv=setTimeout(()=>saveWeek(w),800); el.style.height="auto"; el.style.height=Math.max(44,el.scrollHeight+2)+"px"; return; }
});
/* 입력 중에는 전체를 다시 그리지 않고 현황판만 갱신 */
function refreshBoard(){
  if(S.tab!=="today") return;
  const tmp=document.createElement("div"); tmp.innerHTML=renderToday();
  const nb=tmp.querySelector(".board"), ob=document.querySelector(".board"); if(nb&&ob) ob.replaceWith(nb);
  ["sleep","journal","steps"].forEach(id=>{ const n=tmp.querySelector("#m-"+id), o=document.getElementById("m-"+id); if(n&&o) o.className=n.className; });
}

/* ---------- 호흡 타이머 ---------- */
let breathT=null, wake=null;
async function startBreath(sec){
  const ov=document.getElementById("ov"), orb=document.getElementById("orb"), ph=document.getElementById("phase"), left=document.getElementById("left");
  ov.hidden=false; document.getElementById("ovStop").focus();
  try{ if(navigator.wakeLock) wake=await navigator.wakeLock.request("screen"); }catch(e){}
  const phases=[["들이쉬기",true],["멈춤",true],["내쉬기",false],["멈춤",false]];
  let elapsed=0;
  const tick=()=>{
    const p=phases[Math.floor(elapsed/4)%4]; ph.textContent=p[0]; orb.classList.toggle("big",p[1]);
    const r=sec-elapsed; left.textContent=Math.floor(r/60)+":"+pad(r%60)+" 남음";
    if(elapsed>=sec){ stopBreath(true,sec); return; }
    elapsed++;
  };
  tick(); breathT=setInterval(tick,1000);
}
function stopBreath(done,sec){
  clearInterval(breathT); breathT=null; document.getElementById("ov").hidden=true; document.getElementById("orb").classList.remove("big");
  try{ wake&&wake.release(); }catch(e){} wake=null;
  if(done){ const v=day(today()); const l=sec>=180?2:1; const cur=v.done.breath&&v.done.breath.lvl||0; if(l>cur){ v.done.breath={lvl:l,at:Date.now()}; saveDay(today()); } render(); toast("호흡 완료 · "+(l===2?"2점":"1점")); }
}
document.getElementById("ovStop").addEventListener("click",()=>stopBreath(false));
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !document.getElementById("ov").hidden) stopBreath(false); });

/* ---------- 탭 ---------- */
const TABS=["today","history","routine","why"];
function route(){ const h=(location.hash||"").replace("#",""); S.tab=TABS.includes(h)?h:"today"; if(S.loaded){ render(); window.scrollTo(0,0); } }
window.addEventListener("hashchange",route);

/* ---------- 날짜가 바뀌면 새로 그림 ---------- */
let renderedDay=today();
/* 앱이 켜져 있는 동안 5분마다 삼성헬스 숫자를 새로 불러옴 */
setInterval(()=>{ if(NATIVE && S.loaded && document.visibilityState==="visible") readHealth(); }, 5*60000);
let renderedBlock=null;
setInterval(()=>{ if(today()!==renderedDay){ renderedDay=today(); S.viewBlock=null; render(); return; } if(S.tab==="today" && !document.activeElement.matches("textarea,input")){ const bi=currentBlockIndex(blocksFor(dayTypeOf(day(today())))); if(renderedBlock!==null && bi!==renderedBlock){ S.viewBlock=null; render(); } renderedBlock=bi; } },60000);

/* ---------- 시작 ---------- */
async function boot(){
  route();
  await initStore();
  try{
    S.settings = await getDoc("meta/settings");
    if(!S.settings){ S.settings=DEFAULT_SETTINGS(); await setDoc("meta/settings",S.settings); }
    S.settings.routine = Object.assign(DEFAULT_SETTINGS().routine, S.settings.routine||{});
    if(!S.settings.v2){ const n=S.settings.routine.novel||{}; if(!n.time) n.time="17:30"; if(!n.cue||n.cue==="하루 중 아무 때나 펜을 들면") n.cue="퇴근하고 가방을 내려놓으면"; S.settings.routine.novel=n; S.settings.v2=true; try{ await setDoc("meta/settings",S.settings); }catch(e){} }
    if(!S.settings.blocks){ S.settings.blocks=clone(DEFAULT_BLOCKS); S.settings.v3=true; try{ await setDoc("meta/settings",S.settings); }catch(e){} }
    S.days = await loadDays(addDays(today(),-100));
    const wks=[isoWeek(today()), isoWeek(addDays(today(),-7))];
    for(const w of wks){ const v=await getDoc("weeks/"+w); if(v) S.weeks[w]=v; }
  }catch(e){
    S.settings = S.settings||DEFAULT_SETTINGS();
    toast("기록을 불러오지 못했어요. 새로고침해 보세요.");
  }
  S.loaded=true; render(); setSync();
  if(NATIVE){ applyPending(); nativeSync(); readHealth(); checkUpdate(); }
  if(db){
    try{ db.doc("days/"+today()).onSnapshot(snap=>{ if(!snap.exists||snap.metadata.hasPendingWrites) return; const a=document.activeElement; if(a&&a.matches("textarea,input")) return; S.days[snap.id]=clone(snap.data()); if(S.tab==="today") render(); },()=>{}); }catch(e){}
  }
}
boot();
})();
