<title>범키데일리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 범키데일리 — 밝은 면 위에 흰 카드, 그 뒤로 옅은 그린 장을 살짝 겹쳐 깊이를 만든다.
   글꼴은 Pretendard 하나. 그린은 한 색이 아니라 50~900 단계로 나눠 면·선·글자에 다르게 쓴다. */
@font-face{font-family:"Pretendard Variable";src:url("fonts/PretendardVariable.woff2") format("woff2-variations"),url("fonts/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-display:swap}
:root{
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --num:var(--font); --serif:var(--font); --display:var(--font);
  /* 그린 단계 */
  --g50:#EFF8F3; --g100:#DCF1E6; --g200:#BCE4D0; --g300:#8DD2B0; --g400:#4CBB8B; --g500:#14A26E; --g600:#0D8A5D; --g700:#0B6F4C; --g800:#0A563C; --g900:#083B2A;
  /* 면과 글자 */
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#F5F8F6; --edge:rgba(16,40,28,.07);
  --ink:#16201B; --muted:#65706A; --faint:#9AA49F;
  --accent:var(--g500); --accent-2:var(--g400); --accent-ink:#FFFFFF; --warn:#C86A12;
  /* 예전 이름을 쓰는 곳을 위해 같은 값으로 */
  --tile:var(--surface-2); --tile-line:var(--edge); --line:var(--edge); --glass-2:var(--g50); --card:var(--surface);
  --s-bg:var(--surface); --s-ink:var(--ink); --s-muted:var(--muted); --s-faint:var(--faint); --s-tile:var(--surface-2); --s-line:var(--edge);
  --h-bg:var(--surface); --h-ink:var(--ink); --h-muted:var(--muted); --h-faint:var(--faint); --h-tile:var(--g50); --h-line:var(--g100); --h-accent:var(--g500); --h-accent-2:var(--g500);
  --sky1:var(--bg);
  /* 깊이 */
  --r-card:22px;
  --sh-0:0 1px 2px rgba(16,40,28,.05);
  --sh-1:0 1px 2px rgba(16,40,28,.04),0 6px 18px -6px rgba(16,40,28,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:-.015em;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100%;font-feature-settings:"tnum" 0}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--g400);outline-offset:2px}
a{color:var(--g700)}
p{margin:0} h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
[hidden]{display:none!important}
/* 바탕: 위쪽에만 아주 옅은 민트 빛 한 겹 */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(90% 38% at 85% -6%,rgba(140,210,176,.30) 0%,rgba(140,210,176,0) 70%),
  radial-gradient(70% 30% at 0% 0%,rgba(220,241,230,.55) 0%,rgba(220,241,230,0) 70%)}
.num{font-variant-numeric:tabular-nums}
/* ---- 레이아웃 ---- */
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:18px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
/* 카드: 불투명한 면. 카드 안에서는 글자·타일 색을 그 면에 맞게 다시 정합니다. */
.glass{color:var(--ink);background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-card);box-shadow:var(--sh-1)}
/* 지금 할 일: 흰 카드 뒤로 옅은 그린 장이 두 겹 살짝 비치게 */
.hero.glass{background:linear-gradient(180deg,var(--g50) 0%,var(--surface) 46%);border:1px solid var(--g100);
  box-shadow:0 10px 0 -5px var(--g100),0 20px 0 -11px var(--g50),0 22px 44px -14px rgba(11,110,75,.22),var(--sh-1);margin-bottom:14px}
nav.tabs.glass{border-color:var(--s-line)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-family:var(--num);font-variant-numeric:tabular-nums}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.topbar{padding:4px 2px 0}
.topbar .date{display:flex;flex-direction:column;gap:2px}
.topbar .date b{font-weight:800;font-size:25px;letter-spacing:-.035em}
.pill{border:1px solid var(--edge);background:var(--surface);color:var(--ink);box-shadow:var(--sh-0);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.glass .pill{background:transparent}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

.sheet{padding:14px;display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--tile);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:12px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.seg button b{font-size:14px} .seg button span{font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] span{color:inherit;opacity:.85}

/* ---- 지금 할 일 (히어로) ---- */
.hero{position:relative;overflow:hidden;padding:24px 22px 20px;display:flex;flex-direction:column;gap:12px;border-radius:28px}
.hero::before{content:none}
.hero > *{position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.state{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;letter-spacing:-.01em;padding:5px 11px 5px 9px;border-radius:99px;background:var(--g100);color:var(--g800);white-space:nowrap;flex:none}
.state i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s ease-out infinite}
.state.is-next i{background:var(--faint);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.hero-time{font-family:var(--num);font-weight:700;font-size:64px;line-height:.95;letter-spacing:-.05em;color:var(--ink);font-variant-numeric:tabular-nums}
.hero-trow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.hero-trow .hero-time{font-size:clamp(48px,16vw,64px);min-width:0}
.hero-steps{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);padding:5px 12px 5px 5px;border-radius:18px;background:var(--surface);border:1px solid var(--edge);box-shadow:var(--sh-0);margin-bottom:4px}
.hero-steps svg{width:34px;height:34px;flex:none}
.hero-steps .tr{fill:none;stroke:var(--g100);stroke-width:3.5}
.hero-steps .pg{fill:none;stroke:var(--g500);stroke-width:3.5;stroke-linecap:round}
.hero-steps .ft{fill:var(--g600)}
.hero-steps span{display:flex;flex-direction:column;line-height:1.1}
.hero-steps b{font-family:var(--num);font-size:17px;font-weight:800;letter-spacing:-.02em}
.hero-steps small{font-size:10px;opacity:.65;white-space:nowrap}
.hero-title{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.22;word-break:keep-all}
.hero-cue{font-size:13px;color:var(--muted);letter-spacing:.01em}
.big{width:100%;border:0;border-radius:18px;padding:16px 20px;font-size:19px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(180deg,var(--g400) 0%,var(--g500) 38%,var(--g600) 100%);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(11,85,59,.2),0 10px 22px -8px rgba(14,138,93,.55);display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .12s ease}
.big:active{transform:scale(.985)}
.big small{font-size:12px;font-weight:600;opacity:.82}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ghost{border:1px solid var(--edge);background:var(--surface);color:var(--ink);border-radius:16px;padding:11px 8px;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.3;box-shadow:var(--sh-0)}
.ghost small{font-size:11px;font-weight:500;color:var(--muted)}
.ghost.wide{grid-column:1/-1}
.linkish{border:0;background:none;color:var(--g700);font-weight:700;font-size:13px;padding:4px 0;text-decoration:none}
.readout{display:flex;align-items:baseline;gap:8px}
.readout b{font-family:var(--num);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.04em}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=time],input[type=date],textarea,select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--g400);box-shadow:0 0 0 3px var(--g100);background:var(--surface)}
textarea{resize:vertical;min-height:46px}
.quote{margin:0;padding:18px 18px 16px;border-radius:16px;background:var(--g50);border:1px solid var(--g100)}

.quote p{font-size:18px;font-weight:600;line-height:1.65;letter-spacing:-.02em;word-break:keep-all;color:var(--g900)}
.quote cite{display:block;margin-top:8px;font-style:normal;font-size:12px;color:var(--muted)}
details.how{border-top:1px solid var(--line);padding-top:10px}
details.how summary{font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
details.how ol{margin:8px 0 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
details.how .tip{margin-top:8px;font-size:13px;color:var(--warn)}

/* ---- 다음 / 진행 ---- */
.next{padding:16px;display:flex;flex-direction:column;gap:8px}
.next-row{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;width:100%;border:0;border-top:1px solid var(--edge);background:transparent;border-radius:0;text-align:left;padding:12px 2px}
.next-row:first-of-type{border-top:0}
.next-row .tb{display:flex;flex-direction:column;gap:1px;min-width:0}
.next-row .t{font-family:var(--num);font-weight:700;font-size:17px;letter-spacing:-.02em;color:var(--g700)}
.next-row .n{font-weight:700;font-size:16px;line-height:1.3;letter-spacing:-.02em}
.next-row .b{font-size:11px;color:var(--faint);letter-spacing:.04em}
.next-row .in{font-size:12px;font-weight:600;color:var(--faint);white-space:nowrap}
.progress{padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.stats3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3{border:0;background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat3 b{font-family:var(--num);font-weight:800;font-size:21px;line-height:1.15;letter-spacing:-.03em}
.stat3 span{font-size:11px;color:var(--muted)}
.mini-ring{width:54px;height:54px;position:relative}
.mini-ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.mini-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;font-size:14px}
.bar{height:6px;border-radius:99px;background:var(--g50);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g300),var(--g500))}
.missed{border:1px solid var(--warn);color:var(--warn);background:transparent;align-self:flex-start}
.done-card{padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.done-card .hero-time{font-size:52px}

/* ---- 하루 타임라인 ---- */
.tl-block{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.tl-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.tl-h h3{font-weight:800;font-size:18px;letter-spacing:-.03em}
.tl-row{display:grid;grid-template-columns:52px 18px 1fr auto;gap:10px;align-items:center;padding:9px 0;border:0;background:none;text-align:left;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);width:100%}
.tl-row:first-of-type{border-top:0}
.tl-row .t{font-family:var(--num);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-row .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--g200)}
.tl-row.s1 .dot{background:var(--g300);border-color:transparent}
.tl-row.s2 .dot{background:var(--g600);border-color:transparent}
.tl-row.sk .dot{background:var(--faint);border-color:transparent}
.tl-row.cur .dot{border-color:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 25%,transparent)}
.tl-row.s2 .n,.tl-row.s1 .n,.tl-row.sk .n{color:var(--muted)}
.tl-row .lab{font-size:11px;color:var(--faint)}

/* ---- 카드 공통 (루틴·기록) ---- */
.card{padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-weight:800;font-size:18px;letter-spacing:-.03em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--g50);color:var(--g800);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;letter-spacing:-.01em}
.btn.primary{background:linear-gradient(180deg,var(--g500),var(--g600));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 14px -6px rgba(14,138,93,.6)}
.btn:disabled{opacity:.45}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}
.ed-row{display:grid;grid-template-columns:92px 1fr auto auto;gap:6px;align-items:center}
.ed-row input[type=time]{padding:7px 6px;font-size:13px}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--g50);color:var(--g700);margin-left:6px;vertical-align:2px;white-space:nowrap}
.update{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--g50);border-color:var(--g200)}
.sync{font-size:12px;color:var(--faint);text-align:center}

/* 기록 화면 (이전 구성 재사용) */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .c{aspect-ratio:1;border-radius:6px;background:var(--surface-2);border:1px solid var(--edge);max-width:100%}
.heat .c.s1{background:var(--g200);border-color:transparent}
.heat .c.s2{background:var(--g500);border-color:transparent}
.heat .c.rest{background:color-mix(in srgb,var(--warn) 30%,transparent);border-color:var(--warn)}
.heat .c.today{outline:2px solid var(--ink);outline-offset:1px}
.heat .c.future{opacity:.3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.pill-stat{background:var(--surface-2);border:0;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.pill-stat .v{font-family:var(--num);font-size:19px;font-weight:800;letter-spacing:-.03em}
.jr{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.jr:first-of-type{border-top:0;padding-top:0}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;padding:0 4px}
.section-h h2{font-weight:800;font-size:19px;letter-spacing:-.03em}
.ev{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.ev:first-of-type{border-top:0;padding-top:0}
.grade{font-family:var(--num);font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.g-a{background:var(--g500);color:#fff} .g-b{background:var(--g50);color:var(--g700)} .g-c{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border:0;background:none;text-align:left;width:100%}
.box{width:22px;height:22px;border-radius:7px;border:1.6px solid #C5CFCA;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.chk[aria-pressed="true"] .box{background:var(--g500);border-color:var(--g500)}
.chk[aria-pressed="true"] .box::after{content:"";width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.skip-note{font-size:13px;font-weight:600;color:var(--warn)}
.todo-edit{display:flex;flex-direction:column;gap:8px}
.todo-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:8px 10px;font-weight:600;box-shadow:var(--sh-0)}
.star{border:0;background:none;font-size:20px;line-height:1;color:var(--faint);padding:2px}
.star.on{color:var(--g500)}
.todo-add{display:grid;grid-template-columns:1fr auto;gap:8px}
.todo-card .chk{padding:6px 0;font-size:15px;flex:1;min-width:0}
.todo-line{display:flex;align-items:center;gap:6px}
.vc .vc-f{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:13px;color:var(--muted)}
.vc .vc-f input,.vc .vc-f select,.vc .vc-raw input{font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box}
.vc .vc-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vc .vc-chk{flex-direction:row;align-items:center;gap:8px;margin-top:30px}
.vc .vc-chk input{width:20px;height:20px}
.vc .vc-raw{display:flex;gap:8px;margin:12px 0 4px}
.vc .vc-last{margin-top:10px;justify-content:space-between;align-items:center}
/* 가계부 */
:root{--m-in:var(--g600);--m-out:#DE4B47}
.m-in{color:var(--m-in)} .m-out{color:var(--m-out)}
.m-big{font-family:var(--num);font-size:32px;font-weight:800;letter-spacing:-.045em;margin-top:2px}
.m-io{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--num);font-size:15px;gap:2px}
.m-sync{margin-top:10px;justify-content:space-between;align-items:center}
.m-seg{margin:2px 0}
.m-budget{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.m-bar{height:8px;border-radius:6px;background:var(--g50);overflow:hidden}
.m-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g300),var(--g500));border-radius:6px}
.m-bar i.warn{background:var(--warn)} .m-bar i.over{background:var(--m-out)}
.linkish.small{font-size:12px}
.m-cal{padding:12px 8px}
.m-dow,.m-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.m-dow span{text-align:center;font-size:12px;color:var(--muted);padding-bottom:6px}
.mc{min-height:58px;border:0;background:transparent;border-radius:10px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);font:inherit}
.mc .n{font-size:13px;font-weight:600} .mc span:not(.n){font-family:var(--num);font-size:9.5px;letter-spacing:-.3px;line-height:1.15}
.mc.today .n{color:var(--g600)} .mc.sel{background:var(--g50);box-shadow:inset 0 0 0 1.5px var(--g400)} .mc.sel .n{color:var(--g800)}
.mc.empty{pointer-events:none}
.m-row{border-top:1px solid var(--edge)} .m-row:first-of-type{border-top:0}
.m-row.ex{opacity:.55}
.m-tx,.m-catrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 2px;color:var(--ink);text-align:left;font:inherit}
.m-ic{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}

const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
function isoWeek(s){ const d=parse(s); const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=t.getUTCFullYear(); const w=Math.ceil(((t-Date.UTC(y,0,1))/86400000+1)/7); return y+"-W"+pad(w); }
function weekDates(s){ const d=parse(s); const day=(d.getDay()+6)%7; const mon=addDays(s,-day); return Array.from({length:7},(_,i)=>addDays(mon,i)); }
const DOW = ["일","월","화","수","목","금","토"];
const today = () => ymd(new Date());

/* ---------- 저장소: 서버 db, 없으면 브라우저 저장 ---------- */
let db = null, mode = "local";
const LS = "frontal-v1:";
const clone = o => JSON.parse(JSON.stringify(o));
async function initStore(){
  try{ if(window.claude && typeof window.claude.use==="function"){ db = await window.claude.use("db"); } }catch(e){ db=null; }
  mode = db ? "cloud" : "local";
}
async function getDoc(path){
  if(db){ try{ const s=await db.doc(path).get(); return s.exists? clone(s.data()) : null; }catch(e){ if(e&&e.code==="unavailable"){ await sleep(800); const s=await db.doc(path).get(); return s.exists?clone(s.data()):null; } throw e; } }

function dayTasks(d){

function focusTask(d){
  const v=day(d), tasks=dayTasks(d), n=nowMin();

/* 시간 옆 오늘 걸음 수 (삼성헬스) */
function heroSteps(v){
  if(!NATIVE && v.steps==null) return "";
  const n=v.steps, pct=n==null?0:Math.min(100,Math.round(n/STEP.full*100));
  const R=17, C=2*Math.PI*R;
  return `<a class="hero-steps" href="#day" aria-label="오늘 걸음 수 ${n==null?"불러오는 중":n.toLocaleString()+"보"}">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="${R}" class="tr"/><circle cx="20" cy="20" r="${R}" class="pg" stroke-dasharray="${(C*pct/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 20 20)"/><ellipse class="ft" cx="16.6" cy="22.4" rx="3" ry="4.6" transform="rotate(-12 16.6 22.4)"/><ellipse class="ft" cx="23.4" cy="17.4" rx="3" ry="4.6" transform="rotate(12 23.4 17.4)"/></svg>
    <span><b>${n==null?"—":n.toLocaleString()}</b><small>걸음 · ${pct}%</small></span></a>`;
}
function renderNow(){
  const d=today(), v=day(d), f=focusTask(d), s=score(d), g=goal(d), tasks=dayTasks(d);
  const doneN=tasks.filter(t=>settled(v,t.id)).length, missed=missedTasks(d);
  let h=topbar(v)+updateBar();
  if(f.t){
    const t=f.t, label=(t.id==="detox"&&f.state==="next"&&v.done.t_jail&&v.done.t_jail.lvl>0)?"디톡스 중":f.state==="now"?"지금 할 일":f.state==="next"?"다음 할 일":f.state==="snoozed"?"잠시 미룬 일":"선택한 할 일";
    const idx=tasks.findIndex(x=>x.id===t.id)+1, left=tasks.filter(x=>!settled(v,x.id)).length;
    const jailOn=t.id==="detox"&&f.state==="next"&&v.done.t_jail&&v.done.t_jail.lvl>0;
    const cue=jailOn?`휴대폰은 감옥에 있어요. ${t.time}에 꺼내면서 체크해요`:f.state==="next"?`${t.time}에 알림으로 알려 드릴게요 · 미리 해도 돼요`:t.core?`${t.core.cue} → ${t.title}`:`오늘 ${idx}번째 할 일 · 남은 일 ${left}개`;
    h+=`<section class="hero glass">
      <div class="hero-top"><span class="state ${f.state==="now"?"":"is-next"}"><i></i>${label}</span><span class="small muted">${esc(t.blockTitle)}</span></div>
      <div class="hero-trow"><div class="hero-time">${esc(t.time||"")}</div>${heroSteps(v)}</div>
      <h1 class="hero-title">${esc(t.title)}</h1>
      <p class="hero-cue">${esc(cue)}</p>
      ${heroBody(t,v)}
      ${f.state==="pick"?`<button class="linkish" data-unpick="1">지금 할 일로 돌아가기</button>`:""}
    </section>`;
  } else {
    h+=`<section class="hero glass done-card"><span class="state is-next"><i></i>오늘 루틴 끝</span><div class="hero-time">${s}<span style="font-size:24px">/${g}점</span></div><p class="hero-title" style="font-size:22px">${s>=g?"오늘도 해냈어요. 푹 자는 것까지가 루틴이에요.":"오늘은 여기까지. 내일 아침 첫 알림부터 다시 시작해요."}</p></section>`;
  }
  if(f.t && f.t.id==="t_money") h+=moneyWeekCard();
  { const n=((S.money&&S.money.meta&&S.money.meta.review)||[]).length; if(n) h+=`<a class="glass card m-nudge" href="#money"><span>💳 돈 내역 <b>${n}건</b>을 확인해 주세요</span><span class="small muted">결제인지·어떤 항목인지 애매한 것들 ›</span></a>`; }
  h+=vcCard(); h+=todoCard(v);
  const upcoming=tasks.filter(t=>!settled(v,t.id) && (!f.t||t.id!==f.t.id) && toMin(t.time)>=nowMin()).slice(0,3);
  const inTxt=t=>{ const m=toMin(t.time)-nowMin(); return m<=0?"지금":m<60?m+"분 뒤":Math.floor(m/60)+"시간 "+(m%60?m%60+"분 ":"")+"뒤"; };
  if(upcoming.length) h+=`<section class="glass next"><div class="row" style="justify-content:space-between"><span class="eyebrow">이어서 예정</span><span class="small muted">${upcoming.length}개</span></div>${upcoming.map(t=>`<button class="next-row" data-pick="${t.id}"><span class="t">${esc(t.time)}</span><span class="tb"><span class="n">${esc(t.title)}</span><span class="b">${esc(t.blockTitle)}${t.core?" · 핵심":""}</span></span><span class="in">${inTxt(t)}</span></button>`).join("")}</section>`;
  const C2=2*Math.PI*22, pct=Math.min(1,s/Math.max(1,g));
  h+=`<section class="glass progress">
    <div class="mini-ring" role="img" aria-label="오늘 ${doneN}/${tasks.length}개 완료"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="22" stroke="rgba(0,0,0,.18)" stroke-width="6" fill="none"/><circle cx="27" cy="27" r="22" stroke="var(--accent)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${C2}" stroke-dashoffset="${C2*(1-pct)}"/></svg><b>${Math.round(pct*100)}%</b></div>
    <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="eyebrow">오늘 진행</span><p style="font-size:15px"><b>${doneN}/${tasks.length}</b>개 지남 · 목표 ${g}점 중 <b>${s}점</b></p>
    ${missed.length?`<button class="pill missed" data-goto="day">놓친 일 ${missed.length}개 보기</button>`:""}</div>
    <div class="stats3"><div class="stat3"><b>${streak().n}</b><span>연속 일</span></div><div class="stat3"><b>${Math.min(TARGET_DAYS,Math.max(1,diffDays(S.settings.startDate,d)+1))}</b><span>66일 중</span></div><div class="stat3"><b>${tasks.length-doneN}</b><span>남은 일</span></div></div>
  </section>
  <p class="sync" id="sync">${esc(syncText())}</p>`;
  return h;
}

/* ---------- 하루 화면 (타임라인) ---------- */
function renderDay(){
  const d=today(), v=day(d), tasks=dayTasks(d), f=focusTask(d), blocks=blocksFor(dayTypeOf(v));
  let h=topbar(v)+todoCard(v)+`<div class="section-h"><h2>오늘 하루</h2><span class="small muted">누르면 그 할 일로 이동해요</span></div>`;
  blocks.forEach(b=>{
    const its=tasks.filter(t=>t.block===b.id); if(!its.length) return;
    const dn=its.filter(t=>settled(v,t.id)).length;
    h+=`<section class="glass tl-block"><div class="tl-h"><h3>${esc(b.title)}</h3><span class="small muted num">${esc(b.start)}–${esc(b.end)} · ${dn}/${its.length}</span></div>
    ${its.map(t=>{ const x=v.done[t.id]; const c=x&&x.lvl===2?"s2":x&&x.lvl===1?"s1":x&&x.skipped?"sk":(f.t&&f.t.id===t.id?"cur":""); const lab=x&&x.lvl===2?"제대로":x&&x.lvl===1?(t.core?"조금":"완료"):x&&x.skipped?"넘김":snoozed(v,t.id)?"미룸":""; return `<button class="tl-row ${c}" data-pick="${t.id}"><span class="t">${esc(t.time)}</span><span class="dot"></span><span class="n">${esc(t.title)}${t.core?`<span class="tag">핵심</span>`:""}</span><span class="lab">${lab}</span></button>`; }).join("")}
    </section>`;
  });
  const w=isoWeek(d), wk=S.weeks[w]||{};
  h+=`<div class="section-h"><h2>이번 주</h2><span class="small muted">${esc(w)}</span></div>

  return h;
}

function streak(){
  const t=today(); let d=success(t)?t:addDays(t,-1); let n=0, rests=0;
  const start=S.settings.startDate;
  while(d>=start){
    if(success(d)){ n++; d=addDays(d,-1); continue; }
    const prev=addDays(d,-1);
    if(prev>=start && success(prev)){ rests++; d=prev; continue; }
    break;
  }
  return {n,rests};
}

const VC_NATIVE_NUM = {"열한":11,"열두":12,"열":10,"한":1,"두":2,"세":3,"네":4,"다섯":5,"여섯":6,"일곱":7,"여덟":8,"아홉":9};

function vcPad(n){ return String(n).padStart(2,"0"); }
function vcYmd(dt){ return dt.getFullYear()+"-"+vcPad(dt.getMonth()+1)+"-"+vcPad(dt.getDate()); }
function vcAdd(dt,n){ const x=new Date(dt); x.setDate(x.getDate()+n); return x; }
function vcNum(s){ if(s==null) return null; if(/^\d+$/.test(s)) return parseInt(s,10); return VC_NATIVE_NUM[s]!=null?VC_NATIVE_NUM[s]:null; }
function vcHour(period,h){
  if(h==null) return null;
  if(/오후|저녁|밤/.test(period||"")) return h<12?h+12:h;
  if(/오전|아침|새벽/.test(period||"")) return h===12?0:h;
  if(/낮/.test(period||"")) return h<7?h+12:h;
  return (h>=1&&h<=6)?h+12:h;   /* '3시 상담' → 오후 3시로 봄 */
}
const VC_H = "(\\d{1,2}|열한|열두|열|한|두|세|네|다섯|여섯|일곱|여덟|아홉)";

function parseSchedule(raw, now){

  let s = " "+String(raw||"").replace(/[.,!?]/g," ").replace(/\s+/g," ").trim()+" ";

  let date=null, start=null, end=null, durMin=null, location="";
  const eat = (re, fn) => { const m=s.match(re); if(!m) return false; if(fn(m)===false) return false; s=s.replace(m[0]," "); return true; };

  /* 날짜 */
  eat(/(\d{1,2})\s*월\s*(\d{1,2})\s*일(에|에는|날)?/, m=>{ let d=new Date(base.getFullYear(), +m[1]-1, +m[2]); if(d<base) d=new Date(base.getFullYear()+1, +m[1]-1, +m[2]); date=d; })
  || eat(/(\d{1,2})\s*\/\s*(\d{1,2})(에|에는)?/, m=>{ let d=new Date(base.getFullYear(), +m[1]-1, +m[2]); if(d<base) d=new Date(base.getFullYear()+1, +m[1]-1, +m[2]); date=d; })
  || eat(/다음\s*달\s*(\d{1,2})\s*일(에|에는)?/, m=>{ date=new Date(base.getFullYear(), base.getMonth()+1, +m[1]); })
  || eat(/(\d{1,2})\s*일\s*(뒤|후)(에)?/, m=>{ date=vcAdd(base,+m[1]); })
  || eat(/(다다음|다음|이번|담)\s*주\s*([월화수목금토일])요일(에|에는|날)?/, m=>{
       const off = m[1]==="다다음"?2:(m[1]==="이번"?0:1);
       const mon = vcAdd(base, -((base.getDay()+6)%7));
       date = vcAdd(mon, off*7 + ((VC_DOW.indexOf(m[2])+6)%7)); })
  || eat(/([월화수목금토일])요일(에|에는|날)?/, m=>{ const g=VC_DOW.indexOf(m[1]); date=vcAdd(base, (g-base.getDay()+7)%7); })
  || eat(/(오늘|금일)(은|에|에는)?/, ()=>{ date=new Date(base); })
  || eat(/(내일)(은|에|에는)?/, ()=>{ date=vcAdd(base,1); })
  || eat(/(모레)(는|에|에는)?/, ()=>{ date=vcAdd(base,2); })
  || eat(/(글피)(는|에|에는)?/, ()=>{ date=vcAdd(base,3); })
  || eat(/\s(\d{1,2})\s*일(에|에는|날)?\s/, m=>{ let d=new Date(base.getFullYear(), base.getMonth(), +m[1]); if(d<base) d=new Date(base.getFullYear(), base.getMonth()+1, +m[1]); date=d; return true; });

  /* 시간: 범위 → 한 시점 → 시:분 → 정오 */
  const tm = (p,h,half,mm)=>{ const hh=vcHour(p,vcNum(h)); if(hh==null||hh>23) return null; return {h:hh, m: half?30:(mm?+mm:0)}; };
  eat(new RegExp(VC_P+"\\s*"+VC_H+"\\s*시\\s*(반|(\\d{1,2})\\s*분)?\\s*(부터|에서|~|-)\\s*"+VC_P+"\\s*"+VC_H+"\\s*시\\s*(반|(\\d{1,2})\\s*분)?\\s*(까지)?"), m=>{
    start=tm(m[1],m[2],m[3]==="반",m[4]); const p2=m[6]||m[1];

  || eat(new RegExp(VC_P+"\\s*(\\d{1,2}):(\\d{2})(에|부터)?"), m=>{ const hh=vcHour(m[1],+m[2]); start={h:hh, m:+m[3]}; })
  || eat(/정오(에)?/, ()=>{ start={h:12,m:0}; });
  if(!start) eat(/(아침|점심|저녁|밤)(에|에는|쯤)?(?=\s)/, m=>{ start={h:{"아침":8,"점심":12,"저녁":19,"밤":21}[m[1]], m:0}; });
  eat(/(\d+|한|두|세|네)\s*시간\s*(반)?\s*(동안)?/, m=>{ durMin = vcNum(m[1])*60 + (m[2]?30:0); })

  /* 제목: 남은 말에서 부탁 표현과 조사를 걷어냄 */
  let title = s.replace(/(일정|약속)?\s*(을|를)?\s*(잡아\s*줘|넣어\s*줘|추가해\s*줘|추가\s*해줘|등록해\s*줘|저장해\s*줘|기록해\s*줘|해\s*줘|알려\s*줘|잡아\s*주세요|넣어\s*주세요|추가해\s*주세요)/g," ")
               .replace(/\s(에|에는|은|는|이|가|을|를|부터|까지|쯤|날)\s/g," ")
               .replace(/\s+(있어|있어요|있음|있다|있습니다)\s*$/," ")
               .replace(/\s+/g," ").trim()
               .replace(/^(에|에는|은|는|부터)\s+/,"").replace(/\s+일정$/,"").trim();
  if(!title) title="새 일정";

  if(!date){
    if(start){ const t=new Date(base); t.setHours(start.h,start.m); date = t>now ? new Date(base) : vcAdd(base,1); }
    else date=new Date(base);
  }
  if(start && !end){ const em=start.h*60+start.m+(durMin||60); end={h:Math.floor(em/60)%24, m:em%60}; }
  const hm = t => t ? vcPad(t.h)+":"+vcPad(t.m) : "";
  return {raw:String(raw||"").trim(), title, date:vcYmd(date), allDay:!start, start:hm(start), end:hm(end), location};
}

function vcDoAdd(){

  if(String((S.settings||{}).calendarId||"")!==String(cal.id)){ S.settings.calendarId=String(cal.id); try{ setDoc("meta/settings",S.settings); }catch(e){} }
  let r={}; try{ r=JSON.parse(NATIVE.addEvent(JSON.stringify(Object.assign({},d,{calendarId:cal.id, remind:30})))); }catch(e){ r={ok:false,error:String(e)}; }

}

  if(a==="type"){ S.vc.draft=parseSchedule("",new Date()); S.vc.draft.raw=""; render(); setTimeout(()=>{ const r=document.getElementById("vcRaw"); if(r) r.focus(); },50); return; }
  if(a==="reparse"){ const r=document.getElementById("vcRaw"); S.vc.draft=parseSchedule(r?r.value:"",new Date()); render(); return; }
  if(a==="cancel"){ S.vc.draft=null; render(); return; }
  if(a==="add"){ vcReadForm(); if(NATIVE.calendarStatus()!=="granted"){ S.vc.pendingAdd=true; NATIVE.requestCalendarPermission(); return; } vcDoAdd(); return; }

}

function moneyNum(s){ return parseInt(String(s).replace(/[^\d]/g,""),10)||0; }

function parseFinSms(body, ts, addr){
  if(!body) return null;
  let t = String(body).replace(/\[Web발신\]|\[국외발신\]|\[국제발신\]/g,"").replace(/\r/g,"").trim();
  if(/\(광고\)|광고\)|인증번호|비밀번호|OTP|승인거절|거절|한도초과|결제\s*예정|결제예정|명세서|청구|이벤트|당첨|안내드립니다|자동납부\s*등록|해지|발급|배송/.test(t)) return null;
  const isCancel = /취소/.test(t) && /(승인|결제|매출)/.test(t);
  const isIn = !isCancel && /입금/.test(t) && !/출금/.test(t);
  const isOut = !isCancel && !isIn && /(승인|결제|출금|이체|체크|사용|매출)/.test(t);
  if(!isCancel && !isIn && !isOut) return null;

  /* 금액 */
  let amount = 0;
  const bank = t.match(/(입금|출금|이체|지급)\s*:?\s*(\d{1,3}(?:,\d{3})+|\d+)\s*원?/);
  if(bank && (isIn || /출금|이체|지급/.test(bank[1]))) amount = moneyNum(bank[2]);
  if(!amount){
    const re = /(\d{1,3}(?:,\d{3})+|\d+)\s*원/g; let m;
    while((m=re.exec(t))){
      const before = t.slice(Math.max(0,m.index-7), m.index);
      if(/누적|잔액|한도|포인트|적립|총|가능|이용가능/.test(before)) continue;
      amount = moneyNum(m[1]); break;
    }
  }
  let fx = null;
  if(!amount){ const f = t.match(/(USD|US\$|EUR|JPY|CNY|\$)\s*([\d,]+(?:\.\d+)?)/); if(f){ fx = f[1].replace("US$","USD").replace("$","USD")+" "+f[2]; } }
  if(!amount && !fx) return null;

  /* 날짜 */
  const base = new Date(ts||Date.now());
  let when = new Date(base);
  const dm = t.match(/(\d{1,2})[\/.-](\d{1,2})\s*(?:\([^)]\))?\s*(\d{1,2}):(\d{2})/);
  if(dm){
    let y = base.getFullYear(); const mo=+dm[1]-1, d=+dm[2];
    if(mo===11 && base.getMonth()===0) y--;     /* 1월에 받은 12월 거래 */
    const c = new Date(y, mo, d, +dm[3], +dm[4]);
    if(!isNaN(c)) when = c;
  }

  /* 어디서 */
  const srcM = t.match(FIN_SRC);
  const source = srcM ? (srcM[1]+(srcM[2]||"")).replace(/^국민/,"KB국민") : (addr||"");
  let rest = t
    .replace(/누적\s*:?\s*[\d,]+\s*원?|총누적\s*:?\s*[\d,]+\s*원?|잔액\s*:?\s*[\d,]+\s*원?|이용가능\s*[\d,]+\s*원?/g," ")
    .replace(/(\d{1,3}(?:,\d{3})+|\d+)\s*원/g," ")
    .replace(/(입금|출금|이체|지급)\s*:?\s*(\d{1,3}(?:,\d{3})+|\d+)/g," ")
    .replace(/\(금액\)/g," ")
    .replace(/(USD|US\$|EUR|JPY|CNY|\$)\s*[\d,]+(?:\.\d+)?/g," ")
    .replace(/(\d{1,2})[\/.-](\d{1,2})\s*(?:\([^)]\))?\s*(\d{1,2}):(\d{2})/g,"\n\u0001")
    .replace(/\d{2,6}-\*{2,}-?[\d*]*|\d{3,}\*+\d*|[\d*]{4,}/g," ")
    .replace(/\(\s*[\d*]{3,5}\s*\)|[\d]\*[\d]\*/g," ")
    .replace(/[가-힣]\*[가-힣]{0,2}\s*님?/g," ")
    .replace(/일시불|할부\s*\d+\s*개월|\(\s*\d+\s*개월\s*\)|\d+개월|체크카드|체크|신용/g," ")
    .replace(/승인취소|승인|결제|취소|사용|매출|입금|출금|이체|지급|누적|잔액|원\b/g," ")
    .replace(/\[[^\]]*\]/g," ")
    .replace(FIN_SRC," ")
    .replace(/카드|은행|님/g," ");
  const withMark = rest; rest = rest.replace(/\u0001/g,"");
  const parts = rest.split(/\n/).map(s=>s.replace(/[()]/g," ").replace(/\s+/g," ").trim()).filter(s=>s && /[가-힣A-Za-z]/.test(s) && !/^(M|ZERO|the|X|Edition|SOL|KB)$/i.test(s));
  let merchant = "";
  if(dm){ const after = withMark.slice(withMark.indexOf("\u0001")+1).split(/\n/).map(s=>s.replace(/[()]/g," ").replace(/\s+/g," ").trim()).filter(s=>s && /[가-힣A-Za-z]/.test(s)); merchant = after[0] || ""; }
  if(!merchant) merchant = parts[parts.length-1] || "";
  merchant = merchant.replace(/^[\s\-:·]+|[\s\-:·]+$/g,"").slice(0,30) || source || "알 수 없음";

  const amt = isCancel ? -amount : amount;
  return {type: isIn?"in":"out", amount: amt, fx, merchant, source, ts: when.getTime(), cancel: isCancel, bank: !!bank};
}

function guessCat(tx, rules){
  const key = (tx.merchant||"").trim();
  if(rules && rules[key] && rules[key].cat) return rules[key].cat;
  const hay = (key+" "+(tx.source||"")).toUpperCase();
  const list = tx.type==="in" ? INCOME_CATS : MONEY_CATS;
  let best=null, bestLen=0;   /* 가장 길게 맞는 낱말이 이김: '하이마트'가 '마트'보다 우선 */
  for(const c of list) for(const k of c.kw){ const K=k.toUpperCase(); if(K.length>bestLen && hay.includes(K)){ best=c.id; bestLen=K.length; } }
  if(best) return best;
  if(tx.type==="out" && (tx.bank || /은행|뱅크/.test(tx.source||""))) return "transfer";
  return tx.type==="in" ? "inetc" : "etc";
}

S.money = {months:{}, meta:{lastSync:0, rules:{}, budget:0, deleted:[], review:[], srcRules:{}}, ym:null, sel:null, view:"cal", edit:null, catFilter:null, syncing:false, loaded:false, permDenied:false};
const won = n => (n<0?"-":"")+Math.abs(Math.round(n)).toLocaleString("ko-KR");
const ymOf = d => d.slice(0,7);
function ymAdd(ym,n){ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
async function moneyLoadMonth(ym){

async function moneyLoad(){
  try{ const m=await getDoc("money/meta"); if(m) S.money.meta=Object.assign(S.money.meta,m); }catch(e){}
  S.money.ym = ymOf(today()); S.money.sel = today();
  for(let i=0;i<4;i++) await moneyLoadMonth(ymAdd(S.money.ym,-i));
  /* 이번 달 자료만: 지난달 이전에 문자·알림으로 들어온 건 정리 (직접 적은 건 그대로) */
  if(!S.money.meta.monthOnly){
    const ms=ymOf(today())+"-01";
    for(const [ym,m] of Object.entries(S.money.months)){ const before=m.tx.length; m.tx=m.tx.filter(t=>!(t.date<ms && /^(sms|mms|noti):/.test(t.id))); if(m.tx.length!==before) moneySaveMonth(ym); }
    S.money.meta.review=(S.money.meta.review||[]).filter(x=>x.tx.date>=ms);
    S.money.meta.trackFrom=S.money.meta.trackFrom||ms; S.money.meta.monthOnly=true; moneySaveMeta();
  }
  if(!S.money.meta.trackFrom){ S.money.meta.trackFrom=ymOf(today())+"-01"; moneySaveMeta(); }
  /* 새 항목(문화·여가 등)이 생기면 '기타'로 둔 자동 기록과 확인 대기 목록을 다시 분류 */
  const M=S.money, CATV=2;
  if((M.meta.catv||1)<CATV){
    for(const [ym,m] of Object.entries(M.months)){ let ch=false; for(const t of m.tx){ if(t.auto&&!t.userCat&&t.cat==="etc"){ const g=guessCat(t,M.meta.rules); if(g!=="etc"){ t.cat=g; ch=true; } } } if(ch) moneySaveMonth(ym); }
    const keep=[];
    for(const x of (M.meta.review||[])){
      const onlyCat=x.reasons.length===1&&/항목/.test(x.reasons[0]); const g=guessCat(x.tx,M.meta.rules);
      if(onlyCat && g!=="etc" && g!=="inetc"){ x.tx.cat=g; const ym=ymOf(x.tx.date); await moneyLoadMonth(ym); M.months[ym].tx.push(x.tx); moneySaveMonth(ym); }
      else keep.push(x);
    }
    M.meta.review=keep; M.meta.catv=CATV; moneySaveMeta();
  }
  S.money.loaded=true;
}
function moneySaveMonth(ym){ try{ setDoc("money/m/"+ym, S.money.months[ym]); }catch(e){} }
function moneySaveMeta(){ try{ setDoc("money/meta", S.money.meta); }catch(e){} }
function moneyAllTx(){ return Object.values(S.money.months).flatMap(m=>m.tx); }

/* 들어온 문자·알림을 판단: 확실하면 바로 기록, 애매하면 '확인 필요'로 물어봄 */
const FIN_APP = /kbstar|kbcard|kbpay|kbank|shinhan|shcard|hanabank|hanacard|hanaskcard|wooribank|wooricard|nonghyup|nhcard|nhbank|nhallone|toss|kakaobank|kakaopay|ibk|citibank|bccard|samsungcard|hyundaicard|lottecard|scbank|epost|suhyup|kfcc|sbi|busanbank|knbank|dgb|kjbank|jbbank|spay|samsung\.android\.wallet|naverfin|payco/i;
const FIN_APP_LABEL = /카드|은행|뱅크|페이|SOL|KB|하나|우리|NH|농협|토스|신한|국민|삼성|현대|롯데|씨티|기업|우체국|새마을|신협/;
function moneySrcKey(s){ return s.pkg ? "app:"+s.pkg : "sms:"+(s.addr||""); }
function moneyJudge(s,p){
  const r=[], key=moneySrcKey(s), srcRule=(S.money.meta.srcRules||{})[key];
  if(p.fx && !p.amount) r.push("해외 결제라 원화 금액을 확인해 주세요");
  if(!p.merchant || (p.merchant===p.source && !s.pkg) || p.merchant==="알 수 없음") r.push("어디서 쓴 돈인지 못 읽었어요");
  if(srcRule!=="auto"){
    if(s.pkg){
      if(s.pkg==="com.kakao.talk"){ if(!(FIN_SRC.test(s.body) && /(승인|출금|입금|결제)/.test(s.body))) r.push("카톡 알림이라 결제인지 확실하지 않아요"); }
      else if(!FIN_APP.test(s.pkg) && !FIN_APP_LABEL.test(s.app||"")) r.push("‘"+(s.app||s.pkg)+"’ 앱 알림이라 결제인지 확실하지 않아요");
    } else if(!FIN_SRC.test(s.body)) r.push("보낸 곳이 카드사·은행인지 모르겠어요");
  }
  return r;
}
function moneyDup(p){ /* 같은 결제가 문자와 앱 알림으로 두 번 온 경우 */
  const near=moneyAllTx().filter(t=>t.type===p.type && t.amount===p.amount && Math.abs((t.ts||0)-p.ts)<=15*60000);
  if(!near.length) return null;
  const m=(p.merchant||"").replace(/\s/g,"");
  const same=near.find(t=>{ const tm=(t.merchant||"").replace(/\s/g,""); return !m || !tm || tm.includes(m.slice(0,4)) || m.includes(tm.slice(0,4)); });
  return same ? "same" : "similar";
}
async function moneyIngest(arr, label){
  const M=S.money; M.meta.review=M.meta.review||[]; M.meta.srcRules=M.meta.srcRules||{};
  const known=new Set(moneyAllTx().map(t=>t.id).concat(M.meta.deleted||[], M.meta.review.map(x=>x.id)));
  const touched=new Set(); let added=0, asked=0;
  for(const s of arr){
    if(!s || !s.id || known.has(s.id)) continue;
    known.add(s.id);
    if((M.meta.srcRules[moneySrcKey(s)])==="ignore") continue;
    const p=parseFinSms(s.body, s.date, s.addr); if(!p) continue;
    /* 쇼핑앱 등 카드·은행이 아닌 앱 알림은 앱 이름을 가맹점으로 */
    if(s.pkg && s.pkg!=="com.kakao.talk" && !FIN_APP.test(s.pkg) && !FIN_APP_LABEL.test(s.app||"")) p.merchant=s.app||p.merchant;
    const dup=moneyDup(p); if(dup==="same") continue;
    const cat=guessCat(p, M.meta.rules), rule=M.meta.rules[p.merchant]||{};
    const reasons=moneyJudge(s,p);
    if(dup==="similar") reasons.push("비슷한 시각에 같은 금액이 이미 기록돼 있어요");
    if(cat==="etc" || cat==="inetc") reasons.push("어떤 항목인지 골라 주세요");
    const d=ymd(new Date(p.ts));
    const tx={id:s.id, ts:p.ts, date:d, type:p.type, amount:p.amount, fx:p.fx||null, merchant:p.merchant, source:p.source||s.app||"", cat, excluded:!!rule.excluded, auto:true, body:String(s.body||"").slice(0,300), via:s.pkg?"app":"sms"};
    if(reasons.length){ M.meta.review.push({id:s.id, src:moneySrcKey(s), srcLabel:s.pkg?(s.app||s.pkg):(s.addr||"문자"), reasons, tx}); asked++; continue; }
    const ym=ymOf(d); await moneyLoadMonth(ym); M.months[ym].tx.push(tx); touched.add(ym); added++;
  }
  touched.forEach(moneySaveMonth);
  M.meta.review=M.meta.review.slice(-300);
  return {added, asked};
}

function moneyMonthStats(ym){
  const tx=(S.money.months[ym]||{tx:[]}).tx.filter(t=>!t.excluded);
  const st={inc:0, out:0, byDay:{}, byCat:{}, inCat:{}, tx};
  for(const t of tx){
    const dd=st.byDay[t.date]||(st.byDay[t.date]={inc:0,out:0});
    if(t.type==="in"){ st.inc+=t.amount; dd.inc+=t.amount; st.inCat[t.cat]=(st.inCat[t.cat]||0)+t.amount; }
    else { st.out+=t.amount; dd.out+=t.amount; st.byCat[t.cat]=(st.byCat[t.cat]||0)+t.amount; }
  }
  st.net=st.inc-st.out;
  return st;
}
function moneyWeekOut(monday){ /* 월~일 지출 합 */
  let sum=0; for(let i=0;i<7;i++){ const d=addDays(monday,i); const m=S.money.months[ymOf(d)]; if(!m) continue; for(const t of m.tx) if(!t.excluded&&t.type==="out"&&t.date===d) sum+=t.amount; }
  return sum;
}

function moneyDonut(entries,total){
  if(!total) return "";
  let acc=0; const R=15.9155, C=2*Math.PI*R;
  const segs=entries.map(([id,v])=>{ const c=catOf(id), len=v/total*C, s=`<circle r="${R}" cx="21" cy="21" fill="none" stroke="${c.color}" stroke-width="6.5" stroke-dasharray="${len.toFixed(3)} ${(C-len).toFixed(3)}" stroke-dashoffset="${(-acc).toFixed(3)}" transform="rotate(-90 21 21)"/>`; acc+=len; return s; }).join("");
  return `<svg viewBox="0 0 42 42" class="m-donut" role="img" aria-label="항목별 지출 비율">${segs}<text x="21" y="20" text-anchor="middle" class="m-dt">지출</text><text x="21" y="25.5" text-anchor="middle" class="m-dv">${won(total)}</text></svg>`;
}
function moneyStats(ym,st){
  const M=S.money;
  const cats=Object.entries(st.byCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const totalOut=cats.reduce((s,[,v])=>s+v,0);
  let h=`<section class="glass card"><h2>어디에 썼나</h2>${totalOut?moneyDonut(cats,totalOut):`<p class="small muted">이번 달 지출 기록이 아직 없어요.</p>`}
    ${cats.map(([id,v])=>{ const c=catOf(id); const p=Math.round(v/totalOut*100); return `<button class="m-catrow" data-m="cat" data-a="${id}" aria-pressed="${M.catFilter===id}"><span class="m-ic" style="background:${c.color}22">${c.icon}</span><span class="m-tt"><b>${c.name}</b><span class="m-pbar"><i style="width:${p}%;background:${c.color}"></i></span></span><span class="m-amt"><b>${won(v)}</b><span class="small muted">${p}%</span></span></button>${M.catFilter===id?st.tx.filter(t=>t.type==="out"&&t.cat===id).sort((a,b)=>b.ts-a.ts).map(t=>`<div class="m-sub"><span class="small muted">${parse(t.date).getMonth()+1}/${parse(t.date).getDate()}</span><span>${esc(t.merchant)}</span><span class="m-out small">${won(t.amount)}</span></div>`).join(""):""}`; }).join("")}
  </section>`;
  /* 주간 지출: 이 달에 걸친 주(월~일) */
  const [y,mo]=ym.split("-").map(Number); const first=ymd(new Date(y,mo-1,1)), lastD=ymd(new Date(y,mo,0));
  let mon=addDays(first, -((parse(first).getDay()+6)%7)); const weeks=[];
  while(mon<=lastD){ weeks.push({mon, v:moneyWeekOut(mon)}); mon=addDays(mon,7); }
  const maxW=Math.max(1,...weeks.map(w=>w.v)), thisMon=weekDates(today())[0];
  const cur=weeks.find(w=>w.mon===thisMon), prevV=moneyWeekOut(addDays(thisMon,-7));
  h+=`<section class="glass card"><h2>주간 지출</h2>
    ${cur?`<p class="small" style="margin-bottom:2px">무지출 데이 <b>${moneyZeroDays(thisMon)}일</b> / 목표 2일</p>`:""}
    ${cur?`<p class="small">이번 주 <b>${won(cur.v)}원</b> · 지난주보다 ${cur.v<=prevV?`<b class="m-in">${won(prevV-cur.v)}원 적게</b>`:`<b class="m-out">${won(cur.v-prevV)}원 더</b>`} 썼어요</p>`:""}
    <div class="m-weeks">${weeks.map(w=>{ const a=parse(w.mon), b=parse(addDays(w.mon,6)); return `<div class="m-wk ${w.mon===thisMon?"cur":""}"><span class="v">${w.v?won(w.v):""}</span><div class="bar"><i style="height:${Math.round(w.v/maxW*100)}%"></i></div><span class="l">${a.getMonth()+1}/${a.getDate()}~${b.getMonth()+1===a.getMonth()+1?"":(b.getMonth()+1)+"/"}${b.getDate()}</span></div>`; }).join("")}</div></section>`;
  /* 최근 3개월 */
  const ms=[ymAdd(ym,-2),ymAdd(ym,-1),ym].map(k=>({k, s:S.money.months[k]?moneyMonthStats(k):{inc:0,out:0,net:0}}));
  const maxM=Math.max(1,...ms.flatMap(x=>[x.s.inc,x.s.out]));
  const avgIn=Math.round(ms.reduce((s,x)=>s+x.s.inc,0)/3), avgOut=Math.round(ms.reduce((s,x)=>s+x.s.out,0)/3), avgNet=avgIn-avgOut;
  h+=`<section class="glass card"><h2>최근 3개월</h2>
    <div class="m-months">${ms.map(x=>`<div class="m-mo"><div class="bars"><i class="bi" style="height:${Math.round(x.s.inc/maxM*100)}%"></i><i class="bo" style="height:${Math.round(x.s.out/maxM*100)}%"></i></div><span class="l">${+x.k.slice(5)}월</span><span class="small ${x.s.net<0?"m-out":"m-in"}">${x.s.net>0?"+":""}${won(x.s.net)}</span></div>`).join("")}</div>
    <div class="m-legend small"><span><i class="bi"></i>수입</span><span><i class="bo"></i>지출</span></div>
    <div class="m-cards"><div class="pill-stat"><span class="small muted">3개월 평균 수입</span><span class="v m-in">+${won(avgIn)}</span></div><div class="pill-stat"><span class="small muted">3개월 평균 지출</span><span class="v m-out">-${won(avgOut)}</span></div>
    <div class="pill-stat"><span class="small muted">3개월 평균 합계</span><span class="v ${avgNet<0?"m-out":"m-in"}">${avgNet>0?"+":""}${won(avgNet)}</span></div><div class="pill-stat"><span class="small muted">이번 달 합계</span><span class="v ${st.net<0?"m-out":"m-in"}">${st.net>0?"+":""}${won(st.net)}</span></div></div></section>`;
  return h;
}

/* ---------- 동작 ---------- */
function mRead(){
  const e=S.money.edit; if(!e) return; const g=id=>document.getElementById(id);
  if(g("mAmt")) e.amount=Math.abs(parseInt(g("mAmt").value||"0",10))||0;
  if(g("mDate")&&g("mDate").value) e.date=g("mDate").value;
  if(g("mMerch")) e.merchant=g("mMerch").value.trim();
  if(g("mMemo")) e.memo=g("mMemo").value.trim();
  if(g("mExcl")) e.excluded=g("mExcl").checked;
  if(g("mRule")) e.rule=g("mRule").checked;
}
function mFind(id){ for(const [ym,m] of Object.entries(S.money.months)){ const i=m.tx.findIndex(t=>t.id===id); if(i>=0) return {ym,i,t:m.tx[i]}; } return null; }
async function moneyHandle(b){
  const M=S.money, a=b.dataset.m, arg=b.dataset.a;
  if(a==="prev"||a==="next"){ M.ym=ymAdd(M.ym, a==="prev"?-1:1); await moneyLoadMonth(M.ym); M.edit=null; M.catFilter=null; render(); return; }
  if(a==="view"){ M.view=arg; M.edit=null; render(); return; }
  if(a==="day"){ M.sel=arg; M.edit=null; render(); return; }
  if(a==="sync"){ moneySync(); render(); return; }
  if(a==="perm"){ try{ NATIVE.requestSmsPermission(); }catch(e){ M.permDenied=true; render(); } return; }
  if(a==="noti"){ try{ NATIVE.openNotiAccess(); }catch(e){} return; }
  if(a==="rvAll"||a==="rvOk"||a==="rvNo"||a==="rvCat"||a==="rvEdit"||a==="rvSrc"){
    const R=M.meta.review||[]; const take=id=>{ const i=R.findIndex(x=>x.id===id); return i>=0?R.splice(i,1)[0]:null; };
    const record=async (x,cat)=>{ const t=x.tx; if(cat){ t.cat=cat; M.meta.rules[t.merchant]={cat, excluded:!!t.excluded}; } const ym=ymOf(t.date); await moneyLoadMonth(ym); M.months[ym].tx.push(t); moneySaveMonth(ym); };
    if(a==="rvAll"){ for(const x of R.splice(0)) await record(x); toast("모두 기록했어요"); }
    else if(a==="rvOk"){ const x=take(arg); if(x){ await record(x); toast("기록했어요"); } }
    else if(a==="rvCat"){ const x=take(arg); if(x){ await record(x,b.dataset.c); toast(catOf(b.dataset.c).name+"(으)로 기록했어요 · ‘"+x.tx.merchant+"’은 다음부터 자동"); } }
    else if(a==="rvNo"){ const x=take(arg); if(x){ (M.meta.deleted=M.meta.deleted||[]).push(x.id); toast("기록하지 않았어요"); } }
    else if(a==="rvSrc"){ const x=R.find(y=>y.id===arg); if(x){ M.meta.srcRules[x.src]=b.dataset.c; take(arg); if(b.dataset.c==="auto"){ await record(x); toast("이 앱 알림은 다음부터 바로 기록해요"); } else { (M.meta.deleted=M.meta.deleted||[]).push(x.id); toast("이 앱 알림은 다음부터 무시해요"); } } }
    else if(a==="rvEdit"){ const x=R.find(y=>y.id===arg); if(x){ M.view="cal"; M.sel=x.tx.date; M.ym=ymOf(x.tx.date); await moneyLoadMonth(M.ym); M.edit=Object.assign({rule:true, fromReview:x.id}, clone(x.tx), {id:null, amount:Math.abs(x.tx.amount)}); render(); window.scrollTo(0,0); return; } }
    moneySaveMeta(); render(); return;
  }
  if(a==="appinfo"){ try{ NATIVE.openAppInfo(); }catch(e){} return; }
  if(a==="cat"){ M.catFilter = M.catFilter===arg?null:arg; render(); return; }
  if(a==="budget"){ M.budgetEdit=!M.budgetEdit; render(); return; }
  if(a==="budgetSave"){ const el=document.getElementById("mBudget"); M.meta.budget=Math.max(0,parseInt(String(el?el.value:"").replace(/[^\d]/g,""),10)||0); M.budgetEdit=false; moneySaveMeta(); toast(M.meta.budget?"예산을 "+won(M.meta.budget)+"원으로 정했어요":"예산을 껐어요"); render(); return; }
  if(a==="new"){ M.edit={id:null, type:"out", amount:0, merchant:"", cat:"food", memo:"", date:M.sel||today(), excluded:false, rule:false}; render(); return; }
  if(a==="open"){ if(M.edit&&M.edit.id===arg){ M.edit=null; render(); return; } const f=mFind(arg); if(!f) return; M.edit=Object.assign({rule:true},clone(f.t)); render(); return; }
  if(a==="close"){ M.edit=null; render(); return; }
  if(a==="etype"){ mRead(); M.edit.type=arg; M.edit.cat=arg==="in"?"salary":"food"; render(); return; }
  if(a==="ecat"){ mRead(); M.edit.cat=arg; render(); return; }
  if(a==="del"){ const f=mFind(M.edit.id); if(f){ S.money.months[f.ym].tx.splice(f.i,1); if(/^(sms|mms):/.test(f.t.id)){ (M.meta.deleted=M.meta.deleted||[]).push(f.t.id); M.meta.deleted=M.meta.deleted.slice(-3000); moneySaveMeta(); } moneySaveMonth(f.ym); } M.edit=null; toast("지웠어요"); render(); return; }
  if(a==="save"){
    mRead(); const e=M.edit;

    if(!e.merchant) e.merchant = e.type==="in"?"수입":"지출";
    const ym=ymOf(e.date); await moneyLoadMonth(ym);
    if(e.id){
      const f=mFind(e.id); if(f){ const keepSign=f.t.amount<0?-1:1; Object.assign(f.t,{amount:keepSign*e.amount, merchant:e.merchant, cat:e.cat, memo:e.memo, excluded:e.excluded, date:e.date, userCat:true});
        if(f.ym!==ym){ S.money.months[f.ym].tx.splice(f.i,1); f.t.ts=parse(e.date).getTime()+12*3600000; S.money.months[ym].tx.push(f.t); moneySaveMonth(f.ym); }
        moneySaveMonth(ym); }
    } else {
      const rv = e.fromReview ? (M.meta.review||[]).find(x=>x.id===e.fromReview) : null;
      if(rv){ M.meta.review=M.meta.review.filter(x=>x.id!==e.fromReview); moneySaveMeta(); }
      S.money.months[ym].tx.push({id: rv ? rv.id : "m_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), ts: rv ? rv.tx.ts : parse(e.date).getTime()+12*3600000, date:e.date, type:e.type, amount:(rv&&rv.tx.amount<0?-1:1)*e.amount, merchant:e.merchant, source: rv ? rv.tx.source : "직접", cat:e.cat, memo:e.memo, excluded:e.excluded, manual:!rv, auto:!!rv, userCat:!!rv, body: rv ? rv.tx.body : undefined});
      moneySaveMonth(ym);

    M.sel=e.date; M.edit=null; toast("저장했어요"); render(); return;
  }
}
/* 금요일 '가계부 정리' 시간에 지금 화면에 보여 줄 한 주 요약 */
function moneyZeroDays(mon){ /* 이번 주(오늘까지) 지출 0원인 날 */
  let n=0; for(let i=0;i<7;i++){ const d=addDays(mon,i); if(d>today()||d<(S.money.meta.trackFrom||"9999")) continue; const m=S.money.months[ymOf(d)]; const out=m?m.tx.filter(t=>!t.excluded&&t.type==="out"&&t.date===d).reduce((s,t)=>s+t.amount,0):0; if(out<=0) n++; } return n;
}
function moneyWeekCard(){
  const mon=weekDates(today())[0], v=moneyWeekOut(mon), pv=moneyWeekOut(addDays(mon,-7));
  const st=moneyMonthStats(ymOf(today())); const top=Object.entries(st.byCat).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return `<section class="glass card"><div class="row" style="justify-content:space-between"><span class="eyebrow">이번 주 돈 돌아보기</span><a class="small" href="#money">가계부 열기 ›</a></div>
    <p style="margin:6px 0 4px">이번 주 지출 <b>${won(v)}원</b> · 지난주 ${won(pv)}원</p>
    <p class="small" style="margin:0 0 4px">무지출 데이 <b>${moneyZeroDays(mon)}일</b> / 목표 2일 ${moneyZeroDays(mon)>=2?"· 달성 🎉":""}</p>
    ${top.length?`<p class="small muted" style="margin:0">이번 달 많이 쓴 곳: ${top.map(([id,x])=>catOf(id).icon+" "+catOf(id).name+" "+won(x)).join(" · ")}</p>`:""}
    <p class="small muted" style="margin:6px 0 0">반성 한 줄: 다음 주에 줄일 항목 하나만 정해 ‘저녁 3줄 기록’에 적어 보세요.</p></section>`;
}

function applyPending(){
  if(!NATIVE) return;
  let arr=[]; try{ arr=JSON.parse(NATIVE.takePendingChecks()||"[]"); }catch(e){}
  if(!arr.length) return;
  const touched=new Set();
  arr.forEach(p=>{ if(!p||!p.id||!p.date) return; const v=day(p.date);

function renderWhy(){
  return `<div class="section-h" style="margin-top:12px"><h2>왜 이 미션인가</h2><span class="small muted">근거와 설계 원리</span></div>
  <section class="glass card">
    <p>유튜브 내용을 연구와 대조해 근거가 강한 것부터 미션으로 넣었어요. 등급은 <span class="grade g-a">강</span> 여러 연구에서 일관됨, <span class="grade g-b">중</span> 효과는 있으나 작음, <span class="grade g-c">약</span> 소규모·재현 불확실입니다.</p>
  </section>
  <section class="glass card">
    <div class="ev"><h3>수면<span class="grade g-a">강</span></h3><p class="small">하룻밤만 못 자도 감정 반응을 담당하는 편도체가 크게 과민해지고, 이를 누르는 전전두엽과의 연결이 약해진다는 연구가 반복해서 나왔어요(Yoo 등, 2007). 그래서 수면을 아침 첫 미션으로 기록합니다.</p><a class="small" href="https://www.sfn.org/publications/latest-news/2015/09/23/lack-of-sleep-may-impair-ability-to-regulate-emotions" target="_blank" rel="noopener">수면 부족과 감정 조절 ↗</a></div>
    <div class="ev"><h3>만약-그러면 계획<span class="grade g-a">강</span></h3><p class="small">‘언제, 어디서, 무엇을’ 미리 정해 두면 목표 달성률이 뚜렷이 오른다는 메타분석이 있어요(94개 연구, Gollwitzer·Sheeran 2006). 루틴 탭의 ‘신호 → 미션’이 이 원리입니다.</p><a class="small" href="https://cancercontrol.cancer.gov/brp/research/constructs/implementation-intentions" target="_blank" rel="noopener">실행 의도 개요 (미국 국립암연구소) ↗</a></div>
    <div class="ev"><h3>유산소 운동<span class="grade g-b">중</span></h3><p class="small">꾸준한 유산소 운동과 한 번의 중강도 운동 모두 실행기능에 도움이 된다는 결과가 있지만 효과 크기는 작은 편이에요. 이미 하는 운동을 인정하고, 바쁜 날엔 10분 걷기로 대신합니다. 부업 직전 걷기는 짧은 운동 직후 집중이 좋아진다는 연구를 적용한 것이에요.</p><a class="small" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11856442/" target="_blank" rel="noopener">중강도 유산소와 실행기능 체계적 고찰 ↗</a></div>
    <div class="ev"><h3>호흡·명상<span class="grade g-b">중</span></h3><p class="small">명상이 실행기능 자체를 키운다는 근거는 작고 연구마다 엇갈려요. 대신 순간적으로 감정을 가라앉히는 도구로 쓰기 좋아서, 오후 수업 전 1~3분으로 짧게 넣었어요.</p><a class="small" href="https://scalda.mijn.bsl.nl/does-mindfulness-meditation-training-enhance-executive-control-a/17493418" target="_blank" rel="noopener">명상과 실행 통제 메타분석 ↗</a></div>
    <div class="ev"><h3>손글씨<span class="grade g-c">약</span></h3><p class="small">2024년 노르웨이 연구에서 손글씨를 쓸 때 타이핑보다 뇌 연결이 넓게 활성화됐어요. 다만 대학생 36명 규모라 결론은 조심스러워요. ‘운동피질의 30%가 손’이라는 수치도 정확한 근거를 찾기 어려워요. 그래도 계획을 종이에 쓰는 건 계획 기능 연습 자체라 아침 미션으로 넣었어요.</p><a class="small" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10853352/" target="_blank" rel="noopener">손글씨와 뇌 연결성 연구 (2024) ↗</a></div>
    <div class="ev"><h3>스마트폰<span class="grade g-c">약</span></h3><p class="small">‘폰이 곁에 있기만 해도 인지 능력이 떨어진다’는 유명한 연구(Ward, 2017)는 이후 재현 연구에서 확인되지 않았어요. 그래서 이 앱은 폰을 수면과 집중 시간을 빼앗는 존재로 보고, 저녁 9시 폰 상자와 부업 시간의 폰 분리를 미션으로 둡니다.</p><a class="small" href="https://pubmed.ncbi.nlm.nih.gov/36007374/" target="_blank" rel="noopener">‘브레인 드레인’ 재현 연구 ↗</a></div>
    <div class="ev"><h3>새로운 도전·기록·관계<span class="grade g-c">약</span></h3><p class="small">새로움, 일기, 감사·용서가 전두엽을 직접 강화한다는 근거는 아직 약해요. 다만 사회적 지지와 기록이 스트레스 관리에 좋다는 근거는 많아요. 매일 바뀌는 필사 글귀는 손을 쓰면서 한 문장을 곱씹는 시간이고, 같은 루틴이 지루해지는 걸 막는 장치이기도 해요. 글귀는 논어·노자 같은 동양 고전과 세네카·마르쿠스 아우렐리우스 같은 스토아 철학에서 골라 직접 우리말로 옮겼어요.</p></div>
  </section>
  <section class="glass card"><h2>오래 가게 만드는 장치</h2>
  <ul class="small" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
    <li><b>작은 버전도 점수</b> · 의지가 없는 날에도 1분이면 체크할 수 있게.</li>
    <li><b>두 번 연속만 빠지지 말기</b> · 습관 연구에서 하루를 빠뜨려도 습관 형성에 큰 영향이 없었어요(Lally, 2010). 하루는 ‘쉼표’로 연속 기록이 이어집니다.</li>
    <li><b>평일·주말 루틴</b> · 요일에 맞춰 시간대와 할 일이 자동으로 바뀌어요. 지금 시간대의 할 일만 보여서 한 번에 한 묶음에만 집중할 수 있어요.</li>
    <li><b>컨디션 3가지</b> · 보통은 만점의 70%, 바쁜 날 45%, 약속 있는 날 55%(부업 블록 쉼)가 목표예요. 날에 맞춰 기준을 바꾸면 ‘오늘은 망했다’로 포기하는 날이 줄어요.</li>
    <li><b>매일 바뀌는 필사 글귀</b> · 고정 루틴에 하루 하나씩 새 문장이 들어옵니다.</li>
    <li><b>66일 진행 바</b> · 습관이 자리 잡는 데 평균 66일(사람에 따라 18~254일)이 걸렸다는 연구 기준이에요.</li>
    <li><b>주간 회고</b> · 의지가 아니라 환경을 하나씩 고치는 질문으로 마무리합니다.</li>
  </ul></section>`;

function journalLevel(v){ const j=v.journal||{}; const n=["good","bad","next"].filter(k=>(j[k]||"").trim()).length; return n===0?0:n===3?2:1; }

/* ---------- 호흡 타이머 ---------- */
let breathT=null, wake=null;
async function startBreath(sec){
  const ov=document.getElementById("ov"), orb=document.getElementById("orb"), ph=document.getElementById("phase"), left=document.getElementById("left");
  ov.hidden=false; document.getElementById("ovStop").focus();
  try{ if(navigator.wakeLock) wake=await navigator.wakeLock.request("screen"); }catch(e){}
  const phases=[["들이쉬기",true],["멈춤",true],["내쉬기",false],["멈춤",false]];
  let elapsed=0;
  const tick=()=>{
    const p=phases[Math.floor(elapsed/4)%4]; ph.textContent=p[0]; orb.classList.toggle("big",p[1]);
    const r=sec-elapsed; left.textContent=Math.floor(r/60)+":"+pad(r%60)+" 남음";
    if(elapsed>=sec){ stopBreath(true,sec); return; }
    elapsed++;
  };
  tick(); breathT=setInterval(tick,1000);
}
function stopBreath(done,sec){
  clearInterval(breathT); breathT=null; document.getElementById("ov").hidden=true; document.getElementById("orb").classList.remove("big");
  try{ wake&&wake.release(); }catch(e){} wake=null;
  if(done){ const v=day(today()); const l=sec>=180?2:1; const cur=v.done.breath&&v.done.breath.lvl||0; if(l>cur){ v.done.breath={lvl:l,at:Date.now()}; saveDay(today()); } render(); toast("호흡 완료 · "+(l===2?"2점":"1점")); }
}
document.getElementById("ovStop").addEventListener("click",()=>stopBreath(false));
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !document.getElementById("ov").hidden) stopBreath(false); });


/* ---------- 탭 ---------- */
const TABS=["now","day","money","routine","history"];
function route(){ let h=(location.hash||"").replace("#",""); if(h==="today") h="now"; S.tab=TABS.includes(h)?h:"now"; if(S.loaded){ render(); window.scrollTo(0,0); } }
window.addEventListener("hashchange",route);

/* ---------- 시간이 흐르면 화면도 따라감 ---------- */
let renderedDay=today(), renderedFocus=null;
setInterval(()=>{ if(NATIVE && S.loaded && document.visibilityState==="visible") readHealth(); }, 5*60000);
setInterval(()=>{
  if(!S.loaded) return;
  applySky();
  if(today()!==renderedDay){ renderedDay=today(); S.pick=null; render(); nativeSync(); return; }
  const a=document.activeElement; if(a&&a.matches&&a.matches("textarea,input,select")) return;
  const f=focusTask(today()), key=(f.t?f.t.id:"")+f.state;
  if(S.tab==="now" && renderedFocus!==null && key!==renderedFocus) render();
  renderedFocus=key;
},30000);

/* ---------- 시작 ---------- */
async function boot(){
  applySky();
  route();
  await initStore();
  try{
    S.settings = await getDoc("meta/settings");
    if(!S.settings){ S.settings=DEFAULT_SETTINGS(); await setDoc("meta/settings",S.settings); }
    if(!S.settings.v4){ S.settings.blocks=clone(DEFAULT_BLOCKS); S.settings.v4=true; try{ await setDoc("meta/settings",S.settings); }catch(e){} }
    if(!S.settings.v5){ S.settings.blocks.weekday=clone(DEFAULT_BLOCKS.weekday); S.settings.v5=true; try{ await setDoc("meta/settings",S.settings); }catch(e){} }
    if(!S.settings.v6){ /* 아침 먹기 → 평일은 점심 도시락 챙기기, 주말은 빼기 */
      ["weekday","weekend"].forEach(type=>{ (S.settings.blocks[type]||[]).forEach(b=>{ b.tasks=b.tasks.flatMap(t=>{ if(t&&t.id==="t_breakfast") return type==="weekday"?[{id:"t_lunch", title:"점심 도시락 챙기기", time:t.time}]:[]; return [t]; }); }); });
      S.settings.v6=true; try{ await setDoc("meta/settings",S.settings); }catch(e){} }
    if(!S.settings.v7){ /* 평일 아침: 이부자리 → 창문 → 물 한 잔 → 점심 → 폰·시계·가방·차키, 8시 전에 끝 */
      const wake=(S.settings.blocks.weekday||[]).find(b=>b.id==="wake");
      if(wake){ const def=DEFAULT_BLOCKS.weekday.find(b=>b.id==="wake"); const known=new Set(def.tasks.map(t=>(taskInfo(t)||{}).id)); const extra=wake.tasks.filter(t=>{ const ti=taskInfo(t); return ti && !known.has(ti.id); }); wake.tasks=clone(def.tasks).concat(extra); }
      S.settings.v7=true; try{ await setDoc("meta/settings",S.settings); }catch(e){} }
    if(!S.settings.v8){ /* 평일 오후 2시: 업무 시작 알림 */
      const work=(S.settings.blocks.weekday||[]).find(b=>b.id==="work");
      if(work && !work.tasks.some(t=>t&&t.id==="t_work")) work.tasks.push({id:"t_work", title:"오후 업무 시작 · 할 일 처리", time:"14:00"});
      S.settings.v8=true; try{ await setDoc("meta/settings",S.settings); }catch(e){} }
    if(!S.settings.v9){ /* 평일 저녁: 17시 운동 → 집에서 저녁·설거지·청소 → 쉼+편집 알바 → 23:30 취침 */
      const ids=["after","home","side","night"], wk=S.settings.blocks.weekday||[];
      const defs=DEFAULT_BLOCKS.weekday.filter(b=>ids.includes(b.id));
      const known=new Set(); defs.forEach(b=>b.tasks.forEach(t=>known.add((taskInfo(t)||{}).id)));
      const extra=[]; wk.filter(b=>ids.includes(b.id)).forEach(b=>b.tasks.forEach(t=>{ const ti=taskInfo(t); if(ti&&!known.has(ti.id)) extra.push(t); }));
      const fresh=clone(defs); if(extra.length) fresh.find(b=>b.id==="side").tasks.push(...extra);
      const at=wk.findIndex(b=>ids.includes(b.id));
      S.settings.blocks.weekday=wk.filter(b=>!ids.includes(b.id)); S.settings.blocks.weekday.splice(at<0?S.settings.blocks.weekday.length:at,0,...fresh);
      S.settings.v9=true; try{ await setDoc("meta/settings",S.settings); }catch(e){} }
    if(!S.settings.v10){ /* 금요일 저녁: 가계부 정리와 한 주 반성 */
      const side=(S.settings.blocks.weekday||[]).find(b=>b.id==="side");
      if(side && !side.tasks.some(t=>t&&t.id==="t_money")) side.tasks.unshift({id:"t_money", title:"가계부 정리 · 한 주 돌아보기", time:"19:50", days:[5]});
      S.settings.v10=true; try{ await setDoc("meta/settings",S.settings); }catch(e){} }
    if(!S.settings.v11){ /* 호흡 빼기, 23시 취침, 여자친구에게 따뜻한 한마디, 주 2회 무지출 데이 */
      const fresh=(type,ids)=>{ const wk=S.settings.blocks[type]||[]; const defs=DEFAULT_BLOCKS[type].filter(b=>ids.includes(b.id));
        const known=new Set(); defs.forEach(b=>b.tasks.forEach(t=>known.add((taskInfo(t)||{}).id))); known.add("breath");
        const extra=[]; wk.filter(b=>ids.includes(b.id)).forEach(b=>b.tasks.forEach(t=>{ const ti=taskInfo(t); if(ti&&!known.has(ti.id)) extra.push(t); }));
        const nb=clone(defs); if(extra.length) nb[nb.length-1].tasks.push(...extra);
        const at=wk.findIndex(b=>ids.includes(b.id)); const rest=wk.filter(b=>!ids.includes(b.id)); rest.splice(at<0?rest.length:at,0,...nb); S.settings.blocks[type]=rest; };
      fresh("weekday",["after","home","side","night"]);
      const wake=(S.settings.blocks.weekday||[]).find(b=>b.id==="wake"); if(wake && !wake.tasks.some(t=>t&&t.id==="t_nospend_am")) wake.tasks.push({id:"t_nospend_am", title:"오늘은 무지출 데이 · 카드 쓰지 않기", time:"08:00", days:[2,4]});
      (S.settings.blocks.weekend||[]).forEach(b=>{ b.tasks=b.tasks.filter(t=>!(t&&t.core==="breath")); });
      const wn=(S.settings.blocks.weekend||[]).find(b=>b.id==="night"); if(wn && !wn.tasks.some(t=>t&&t.id==="t_warm")){ const k=wn.tasks.findIndex(t=>t&&t.core==="phone"); wn.tasks.splice(k<0?wn.tasks.length:k,0,{id:"t_warm", title:"여자친구에게 따뜻한 한마디", time:"22:05"}); }
      S.settings.v11=true; try{ await setDoc("meta/settings",S.settings); }catch(e){} }
    if(!S.settings.v12){ /* 2026-11-20 정리: 영양제·크레아틴·점심 걷기·샤워·쇼츠 그만, 22:40 묶음, 22:50 폰, 매일 23시 취침, 토요일 눈바디 */
      const wk=S.settings.blocks.weekday||[]; const defs=DEFAULT_BLOCKS.weekday;
      const known=new Set(["newday","t_prep","breath"]); defs.forEach(b=>b.tasks.forEach(t=>known.add((taskInfo(t)||{}).id)));
      const extra=[]; wk.forEach(b=>b.tasks.forEach(t=>{ const ti=taskInfo(t); if(ti&&!known.has(ti.id)) extra.push(t); }));
      /* 사용자가 바꾼 요일(무지출 등)은 유지 */
      const daysOf={}; wk.forEach(b=>b.tasks.forEach(t=>{ if(t&&t.id&&Array.isArray(t.days)) daysOf[t.id]=t.days; }));
      const nb=clone(defs); nb.forEach(b=>b.tasks.forEach(t=>{ if(t&&t.id&&daysOf[t.id]) t.days=daysOf[t.id]; }));
      if(extra.length) nb[nb.length-1].tasks.push(...extra);
      S.settings.blocks.weekday=nb;
      const we=S.settings.blocks.weekend||[]; const ww=we.find(b=>b.id==="wake");
      if(ww){ if(!ww.tasks.some(t=>t&&t.id==="t_body")){ const k=ww.tasks.findIndex(t=>t&&t.core==="plan"); ww.tasks.splice(k<0?ww.tasks.length:k,0,{id:"t_body", title:"몸무게·눈바디 기록", time:"07:10", days:[6]}); }
        if(!ww.tasks.some(t=>t&&t.id==="t_creatine")) ww.tasks.push({id:"t_creatine", title:"크레아틴 먹기", time:"08:05"}); }
      const wn=we.find(b=>b.id==="night"); if(wn && !wn.tasks.some(t=>t&&t.id==="t_sleep")) wn.tasks.push({id:"t_sleep", title:"불 끄고 눕기", time:"23:00"});
      S.settings.v12=true; try{ await setDoc("meta/settings",S.settings); }catch(e){} }
    S.days = await loadDays(addDays(today(),-100));
    const wks=[isoWeek(today()), isoWeek(addDays(today(),-7))];
    for(const w of wks){ const v=await getDoc("weeks/"+w); if(v) S.weeks[w]=v; }
  }catch(e){
    S.settings = S.settings||DEFAULT_SETTINGS();
    toast("기록을 불러오지 못했어요. 앱을 다시 열어 주세요.");
  }
  try{ await moneyLoad(); }catch(e){}
  S.loaded=true; render(); setSync();
  if(NATIVE){ applyPending(); nativeSync(); readHealth(); checkUpdate(); moneySync(); }
}
boot();
})();
